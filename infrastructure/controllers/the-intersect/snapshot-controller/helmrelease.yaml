---
# CSI external-snapshotter: VolumeSnapshot CRDs + the snapshot-controller.
# Needed by VolSync (backup plan): it snapshots a PVC, then copies the
# snapshot with restic, so backups are crash-consistent while apps run.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: piraeus-charts
  namespace: snapshot-controller
spec:
  interval: 1h0m0s
  url: https://piraeus.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  chart:
    spec:
      chart: snapshot-controller
      sourceRef:
        kind: HelmRepository
        name: piraeus-charts
      version: 5.3.0
  interval: 1h0m0s
  values:
    installCRDs: true
    # Keep the CRDs if this release is ever removed: deleting the
    # VolumeSnapshot CRDs deletes every VolumeSnapshot (and, with
    # deletionPolicy Delete, the Ceph snapshots behind them).
    keepCRDs: true
