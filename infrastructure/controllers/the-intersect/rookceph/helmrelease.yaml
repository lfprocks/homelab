---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  chart:
    spec:
      chart: rook-ceph
      sourceRef:
        kind: HelmRepository
        name: rook-release
      version: v1.21.1
  interval: 1m0s
  values:
    crds:
      enable: true
    # CSI images are not pinned here. Since 1.21.1 the operator resets
    # rook-csi-operator-image-set-configmap to empty on startup when it holds
    # older images, so ceph-csi-operator always runs its own defaults
    # (cephcsi v3.18.1 with ceph-csi-operator 1.1.0). Values under csi.* had
    # no effect.
    resources:
      limits:
        memory: "2Gi"
        cpu: "500m"
      requests:
        memory: "256Mi"
        cpu: "100m"
