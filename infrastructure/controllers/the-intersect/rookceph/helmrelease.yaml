---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  chart:
    spec:
      chart: rook-ceph
      sourceRef:
        kind: HelmRepository
        name: rook-release
      version: v1.20.8
  interval: 1m0s
  values:
    crds:
      enable: true
    # Rook 1.21 stops setting CSI images and writes an empty
    # rook-csi-operator-image-set-configmap, so ceph-csi-operator would fall
    # back to its own built-in defaults. Pin the set the cluster runs (Rook
    # 1.20.8's defaults); bump these deliberately.
    csi:
      cephcsi:
        repository: quay.io/cephcsi/cephcsi
        tag: v3.17.1
      registrar:
        repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
        tag: v2.17.0
      provisioner:
        repository: registry.k8s.io/sig-storage/csi-provisioner
        tag: v6.2.0
      snapshotter:
        repository: registry.k8s.io/sig-storage/csi-snapshotter
        tag: v8.5.0
      attacher:
        repository: registry.k8s.io/sig-storage/csi-attacher
        tag: v4.12.0
      resizer:
        repository: registry.k8s.io/sig-storage/csi-resizer
        tag: v2.1.0
      csiAddons:
        repository: quay.io/csiaddons/k8s-sidecar
        tag: v0.14.0
    resources:
      limits:
        memory: "2Gi"
        cpu: "500m"
      requests:
        memory: "256Mi"
        cpu: "100m"
