---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
      version: 3.8.2
  interval: 1m0s
  values:
    # NOTE: `installCRDs` and `policyReportsCleanup` existed in 3.3.x and were
    # removed by 3.8.x. CRD installation is now controlled by `crds.groups.*`,
    # which defaults to enabled for every group, so no value is needed. The
    # post-upgrade cleanup hook is now `webhooksCleanup`, which uses
    # ghcr.io/kyverno/readiness-checker instead of the old
    # docker.io/bitnami/kubectl:latest -- that image was both a mutable tag and
    # part of the Bitnami catalog retired from public Docker Hub in 2025.

    features:
      backgroundScan:
        # This is the actual lever for PolicyReport volume, and it is not
        # resourceFilters.
        #
        # `config.resourceFilters` already excludes ReplicaSets -- the chart has
        # shipped `[ReplicaSet,*,*]` and `[ReplicaSet/?*,*,*]` among its ~103
        # defaults in both 3.3.4 and 3.8.2. Adding another copy, as this file
        # briefly did, is a no-op.
        #
        # The reason 446 ReplicaSet-owned PolicyReports exist anyway is that the
        # reports controller runs with `--skipResourceFilters=true` by default,
        # which makes the BACKGROUND SCAN ignore resourceFilters entirely. So it
        # walks every ReplicaSet -- including historical scaled-to-zero ones --
        # and Kyverno's autogen rules cover ReplicaSet, so each one gets a
        # report. Confirmed on the live policy: status.autogen.rules contains
        # autogen-check-* and the ReplicaSet reports are populated by them.
        #
        # Setting this false makes background scan honour the filter list, which
        # drops the ReplicaSet reports and the other ~100 things the chart
        # already says it does not care about (Events, Nodes, kube-system).
        # Admission coverage is untouched: Deployment/StatefulSet/DaemonSet
        # autogen still rejects a bad `kubectl apply`, and Pods are still
        # validated directly.
        skipResourceFilters: false

    # Ships the chart's own dashboard as a ConfigMap labelled
    # `grafana_dashboard: "1"`, which the grafana sidecar picks up. Without this
    # the Audit-tier policies are write-only -- which is how the previous setup
    # decayed into producing findings nobody read.
    #
    # `grafanaDashboard.create` stays at its default of false: that renders a
    # GrafanaDashboard CR for grafana-operator (grafana.integreatly.org), and
    # this cluster does not run it. The CRDs present are grafana-AGENT's
    # (monitoring.grafana.com), which are unrelated.
    grafana:
      enabled: true

    admissionController:
      # This controller is in the admission path for every workload in the
      # cluster, not just the namespaces the policies opt into.
      # kyverno-resource-validating-webhook-cfg registers failurePolicy: Fail
      # over pods/deployments/replicasets/statefulsets/daemonsets/cronjobs/jobs
      # with a namespaceSelector that only excludes kube-system and kyverno --
      # so if this pod is unavailable, the API server cannot ask Kyverno whether
      # it cares, and workload creation fails cluster-wide.
      #
      # It ran as a single replica with no PodDisruptionBudget, which made a
      # routine Talos node drain enough to cause that. Three replicas plus a PDB
      # removes it. `antiAffinity.enabled` is already true by default (soft
      # preferred anti-affinity), so they spread across nodes.
      #
      # The PDB is NOT implied by replicas -- podDisruptionBudget.enabled
      # defaults to false in this chart and has to be asked for explicitly.
      # minAvailable stays at the chart default of 1: with three replicas that
      # still guarantees a webhook endpoint during a drain, without making node
      # maintenance harder than it needs to be.
      replicas: 3
      podDisruptionBudget:
        enabled: true
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        prometheus.istio.io/merge-metrics: "false"
      container:
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi

    backgroundController:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        prometheus.istio.io/merge-metrics: "false"
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 64Mi

    cleanupController:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        prometheus.istio.io/merge-metrics: "false"
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 64Mi

    reportsController:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        prometheus.istio.io/merge-metrics: "false"
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 64Mi
