---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
      version: 3.8.2
  interval: 1m0s
  values:
    # NOTE: `installCRDs` and `policyReportsCleanup` existed in 3.3.x and were
    # removed by 3.8.x. CRD installation is now controlled by `crds.groups.*`,
    # which defaults to enabled for every group, so no value is needed. The
    # post-upgrade cleanup hook is now `webhooksCleanup`, which uses
    # ghcr.io/kyverno/readiness-checker instead of the old
    # docker.io/bitnami/kubectl:latest -- that image was both a mutable tag and
    # part of the Bitnami catalog retired from public Docker Hub in 2025.

    config:
      # `resourceFilters` tells Kyverno which resources to ignore entirely. The
      # chart ships ~30 sensible defaults (Events, kube-system, Nodes, ...) and
      # setting `resourceFilters` here would REPLACE that list, so use the
      # additive `resourceFiltersInclude` instead.
      #
      # ReplicaSets account for 442 of the ~600 non-Pod PolicyReports: Kyverno's
      # autogen covers every pod controller, and every historical scaled-to-zero
      # ReplicaSet gets its own report. Nobody hand-applies a ReplicaSet, so
      # ignoring them costs no admission coverage -- Deployment-level autogen
      # still rejects a bad `kubectl apply`, and the Pods themselves are still
      # validated.
      resourceFiltersInclude:
        - "[ReplicaSet,*,*]"

    # Ships the chart's own dashboard as a ConfigMap labelled
    # `grafana_dashboard: "1"`, which the grafana sidecar picks up. Without this
    # the Audit-tier policies are write-only -- which is how the previous setup
    # decayed into producing findings nobody read.
    #
    # `grafanaDashboard.create` stays at its default of false: that renders a
    # GrafanaDashboard CR for grafana-operator (grafana.integreatly.org), and
    # this cluster does not run it. The CRDs present are grafana-AGENT's
    # (monitoring.grafana.com), which are unrelated.
    grafana:
      enabled: true

    admissionController:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        prometheus.istio.io/merge-metrics: "false"
      container:
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi

    backgroundController:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        prometheus.istio.io/merge-metrics: "false"
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 64Mi

    cleanupController:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        prometheus.istio.io/merge-metrics: "false"
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 64Mi

    reportsController:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        prometheus.istio.io/merge-metrics: "false"
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 64Mi
