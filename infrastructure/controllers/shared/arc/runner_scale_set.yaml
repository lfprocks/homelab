---
# A runner scale set scoped to a single repository.
#
# Scope matters more than usual here. A hosted GitHub runner cannot reach
# 10.0.0.10; this one can, which is the entire point of it and also its main
# risk. It is deliberately bound to timescale-migrations rather than to the
# lfprocks organisation, so adding a repository to the org does not silently
# hand that repository a foothold on the LAN.
#
# The other half of that containment lives in the workflow: only push-to-main
# jobs are allowed to target this scale set. Pull request checks stay on hosted
# runners, so code from an unmerged branch never executes in the cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-timescale-migrations
  namespace: arc-runners
spec:
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
      version: 0.14.2
  interval: 1m0s
  # The workflow's "runs-on" must match this.
  releaseName: timescale-migrations
  values:
    githubConfigUrl: https://github.com/lfprocks/timescale-migrations
    githubConfigSecret: timescale-migrations-github

    # Scale to nothing when idle. Migrations run for a few seconds a handful of
    # times a month; there is no reason to hold a pod open for that.
    minRunners: 0
    maxRunners: 2

    # No containerMode, and specifically no dind.
    #
    # The first version of this used containerMode: dind so the migration
    # tooling could drive throwaway Postgres containers. That rebooted
    # the-intersect-worker-03 twice, once per runner pod, taking other workloads
    # with it. A privileged Docker daemon setting up its own bridge networking
    # and netfilter rules does not belong on a Talos node running Cilium: the
    # OS is immutable and minimal, and dind was visibly failing against it
    # ("Deleting nftables IPv4 rules ... nft: executable file not found").
    #
    # The workflow now downloads the golang-migrate binary instead. It is
    # statically linked and needs no daemon, so the runner is an ordinary
    # unprivileged pod.
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
            # dind previously ran as an unlimited sidecar, so anything it
            # started was invisible to the kubelet. With one container and a
            # limit, the pod cannot grow without bound whatever a job does.
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 1Gi
