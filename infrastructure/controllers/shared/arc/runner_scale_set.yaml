---
# A runner scale set scoped to a single repository.
#
# Scope matters more than usual here. A hosted GitHub runner cannot reach
# 10.0.0.10; this one can, which is the entire point of it and also its main
# risk. It is deliberately bound to timescale-migrations rather than to the
# lfprocks organisation, so adding a repository to the org does not silently
# hand that repository a foothold on the LAN.
#
# The other half of that containment lives in the workflow: only push-to-main
# jobs are allowed to target this scale set. Pull request checks stay on hosted
# runners, so code from an unmerged branch never executes in the cluster.
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: arc-timescale-migrations
  namespace: arc-runners
spec:
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
      version: 0.14.2
  interval: 1m0s
  # The workflow's "runs-on" must match this.
  releaseName: timescale-migrations
  values:
    githubConfigUrl: https://github.com/lfprocks/timescale-migrations
    githubConfigSecret: timescale-migrations-github

    # Scale to nothing when idle. Migrations run for a few seconds a handful of
    # times a month; there is no reason to hold a pod open for that.
    minRunners: 0
    maxRunners: 2

    # The migration tooling drives throwaway Postgres containers, so the runner
    # needs a Docker daemon. dind requires a privileged sidecar, which is the
    # reason this scale set is pinned to one repository and one trigger.
    containerMode:
      type: dind

    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
