---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Runner pods live apart from the controller so that a workflow cannot reach the
# controller's service account, which holds the GitHub credentials for every
# scale set.
#
# Pod security has to be privileged rather than baseline: containerMode dind
# runs a privileged Docker-in-Docker sidecar, and baseline would reject the pod
# outright. That is the cost of letting the migration tooling drive throwaway
# Postgres containers, and it is why this namespace is reachable only from
# push-to-main jobs in one pinned repository.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
