---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Runner pods live apart from the controller so that a workflow cannot reach the
# controller's service account, which holds the GitHub credentials for every
# scale set.
#
# Baseline rather than privileged. This was privileged to admit the dind
# sidecar; without it a runner is an ordinary pod, and baseline now acts as a
# guard rail -- a future change that reintroduces a privileged container gets
# rejected at admission instead of rebooting a node.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
