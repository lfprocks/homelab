apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-cluster-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # The ACME server URL
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Email address used for ACME registration
    email: ${LETSENCRYPT_EMAIL}
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - dns01:
          route53:
            region: us-west-2
            accessKeyIDSecretRef:
              name: certmanager-route53-clusterissuer-secret
              key: aws-access-key-id
            secretAccessKeySecretRef:
              name: certmanager-route53-clusterissuer-secret
              key: aws-secret-access-key
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # The ACME server URL
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email address used for ACME registration
    email: ${LETSENCRYPT_EMAIL}
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      # lfp.rocks is on Cloudflare — use a Cloudflare DNS-01 solver for it.
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - "lfp.rocks"
      # Everything else stays on Route53 (default solver, no selector).
      - dns01:
          route53:
            region: us-west-2
            accessKeyIDSecretRef:
              name: certmanager-route53-clusterissuer-secret
              key: aws-access-key-id
            secretAccessKeySecretRef:
              name: certmanager-route53-clusterissuer-secret
              key: aws-secret-access-key
