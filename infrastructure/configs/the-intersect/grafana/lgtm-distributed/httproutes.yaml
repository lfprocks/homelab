---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-httproute
  namespace: grafana
spec:
  parentRefs:
    - name: external-gateway-https
      namespace: cilium-ingress
  hostnames: ["${SUB_SENIOR_ABLE}.${DOMAIN_CORONET_SUMMIT}"]
  rules:
    - backendRefs:
        - name: lgtm-distributed-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mimir-httproute
  namespace: grafana
spec:
  parentRefs:
    - name: internal-gateway-http
      namespace: cilium-ingress
  hostnames: ["${SUB_PRAIRIE_BEACON}.${DOMAIN_COBRA_LANTERN}"]
  rules:
    - backendRefs:
        - name: lgtm-distributed-mimir-nginx
          port: 80
---
# Log shipping from pet hosts outside the cluster. Internal gateway, TLS listener,
# POST to the push path only: Loki has no authentication here, so its query API
# stays unreachable from the LAN. Anything on the LAN can still write logs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki-push-httproute
  namespace: grafana
spec:
  parentRefs:
    - name: internal-gateway-http
      namespace: cilium-ingress
      sectionName: default-https
  hostnames: ["${SUB_HOLLOW_TANKARD}.${DOMAIN_COBRA_LANTERN}"]
  rules:
    - matches:
        - path:
            type: Exact
            value: /loki/api/v1/push
          method: POST
      backendRefs:
        - name: lgtm-distributed-loki-gateway
          port: 80
