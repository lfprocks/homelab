---
grafana:
  # -- Deploy Grafana if enabled. See [upstream readme](https://github.com/grafana/helm-charts/tree/main/charts/grafana#configuration) for full values reference.
  enabled: true

  image:
    tag: 12.1.0

  resources:
    requests:
      cpu: 10m
      memory: 150Mi
    limits:
      cpu: 256m
      memory: 512Mi

  persistence:
    enabled: true
    size: 10Gi
    storageClassName: smb-client

  # Recreate, not RollingUpdate.
  #
  # Grafana keeps its state in SQLite on the single ReadWriteOnce volume above,
  # and SQLite cannot be opened by two processes across two pods. The chart
  # default is RollingUpdate with maxSurge, so Kubernetes starts the new pod
  # BEFORE stopping the old one, both mount the same database, and the new pod
  # blocks in the SQLite resource server. It never binds :3000, the liveness
  # probe kills it, and the rollout can never complete because RollingUpdate
  # will not retire the old pod until the new one is ready.
  #
  # That is not hypothetical. On 2026-08-03 an upgrade sat in this deadlock for
  # three and a half hours with the HelmRelease in `failed` and the new pod at
  # 44 restarts, serving from the old pod the whole time so nothing looked
  # wrong from outside. It eventually resolved after 53 restarts, by luck
  # rather than design, and would recur on the next upgrade.
  #
  # Recreate stops the old pod first. The trade is a short gap with no Grafana
  # during an upgrade, which is the honest cost of SQLite on one volume: the
  # current setting only appears to give zero-downtime upgrades, and actually
  # gives upgrades that cannot finish.
  #
  # The real fix is moving Grafana off SQLite onto Postgres, which would also
  # rescue the dashboards that exist only on this volume. That is a larger
  # change than this one.
  deploymentStrategy:
    type: Recreate

  # Dashboard sidecar. Until now every dashboard was UI-created and lived only on
  # the PVC above, so there was no GitOps path for shipping one -- which is part
  # of why the kyverno policy results went unread for so long. The sidecar
  # watches for ConfigMaps labelled `grafana_dashboard: "1"` and loads them, so
  # any chart or manifest in the repo can ship a dashboard.
  #
  # searchNamespace ALL is needed because the dashboards come from the namespace
  # that owns them (kyverno, here), not from grafana's. That means a cluster-wide
  # ConfigMap watch; the sidecar only keeps labelled ConfigMaps, so the overhead
  # is one lightweight informer rather than anything proportional to metrics
  # volume.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        memory: 100Mi

  # Alerting for kyverno ENFORCE rejections -- something was actually BLOCKED at
  # admission. The Audit tier only shows up on the dashboard; a rejection was
  # previously silent until a deploy failed and somebody went looking.
  #
  # Delivery reuses pnp (writer -> pulsar -> deliverer -> pushover), the
  # notification path that is actually consumed.
  #
  # Two things here are deliberate and easy to get wrong:
  #
  #   * The body goes in `payload.template`, NOT `message`. `message` only
  #     templates a string field inside grafana's own fixed JSON envelope, which
  #     pnp-writer rejects with a 400. `payload.template` replaces the whole body.
  #
  #   * The grafana chart runs `tpl` over these values, so unescaped {{ }} is
  #     evaluated by HELM at render time and the upgrade dies with
  #     "nil pointer evaluating interface {}.Firing". The backtick block below
  #     makes Helm emit the braces verbatim so grafana evaluates them at alert
  #     time. Verified with `helm template` against lgtm-distributed 2.1.0.
  #
  # Credentials are $__env{} references resolved by grafana from
  # envFromSecret, NOT literals -- values substituted here would land in the
  # generated values ConfigMap in plaintext.
  envFromSecret: grafana-alerting-secrets

  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: pnp-pushover
          receivers:
            - uid: pnp-pushover-webhook
              type: webhook
              settings:
                url: http://pnp-writer.pnp.svc.cluster.local/notifications
                httpMethod: POST
                authorization_scheme: Bearer
                authorization_credentials: $__env{GRAFANA_PNP_TOKEN}
                payload:
                  # Deliberately generic. This contact point serves more than
                  # one alert now, so the wording comes from each rule's
                  # `title` and `summary` annotations rather than being
                  # hardcoded here. A template that names one alert is a
                  # template that lies about every other one.
                  template: |
                    {{ `{
                      "originatingService": "grafana",
                      "idempotencyKey": {{ .GroupKey | toJson }},
                      "content": {
                        "title": {{ (printf "%s (%d)" (or .CommonAnnotations.title .CommonLabels.alertname "grafana alert") (len .Alerts)) | toJson }},
                        "body": {{ (or .CommonAnnotations.summary .CommonLabels.alertname "grafana alert") | toJson }},
                        "priority": 0
                      },
                      "pushover": { "userOrGroupKey": "$__env{GRAFANA_PUSHOVER_USER_KEY}" }
                    }` }}

    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: grafana-default-email
          routes:
            - receiver: pnp-pushover
              object_matchers:
                - ["alertname", "=", "KyvernoEnforceRejection"]
              # Grouped so a ReplicaSet retrying a rejected pod yields one
              # notification per namespace+policy rather than one per attempt.
              group_by: ["resource_namespace", "policy_name"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
            - receiver: pnp-pushover
              object_matchers:
                - ["alertname", "=", "BatteryMidpointDeviation"]
              group_by: ["alertname"]
              # Longer waits than kyverno on purpose. This condition tracks the
              # charge cycle rather than a discrete event: it appears as the
              # pack enters absorption and clears when charging stops, so it
              # can last an hour. repeat_interval of 24h means an imbalance
              # that persists for weeks is one notification a day, not one per
              # evaluation.
              group_wait: 5m
              group_interval: 30m
              repeat_interval: 24h
            - receiver: pnp-pushover
              object_matchers:
                - ["alertname", "=", "CameraUploadStale"]
              group_by: ["alertname"]
              group_wait: 30s
              group_interval: 30m
              # A camera that has stopped is not urgent the way a dead sensor
              # is -- the frames are a timelapse, not a control loop -- so this
              # repeats less often than the others.
              repeat_interval: 12h
            # Both Victron rules, matched by pattern so the pair shares one
            # policy. Grouped by alertname rather than merged into it: the two
            # devices fail together often enough to want one notification when
            # the radio dies, and separately often enough to want to be told
            # which one when only one does.
            - receiver: pnp-pushover
              object_matchers:
                - ["alertname", "=~", "Victron(Solar|Shunt)DataStale"]
              group_by: ["alertname"]
              group_wait: 30s
              group_interval: 15m
              repeat_interval: 6h
            - receiver: pnp-pushover
              object_matchers:
                - ["alertname", "=", "SensorDataStale"]
              group_by: ["alertname"]
              # Short group_wait: the alert already waited 20 minutes for the
              # data to go stale and 5 more to confirm it. Adding more delay
              # only widens the window in which nobody knows.
              group_wait: 30s
              group_interval: 15m
              # An outage that lasts a day should say so again. Six hours is
              # long enough not to nag and short enough that a notification
              # missed overnight is repeated in the morning.
              repeat_interval: 6h

    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: kyverno
          folder: alerts
          interval: 1m
          rules:
            - uid: kyverno-enforce-rejection
              title: KyvernoEnforceRejection
              condition: fired
              for: 0m
              annotations:
                # Static: any {{ }} here would hit the same Helm tpl problem.
                # The namespace and policy are carried on the alert labels.
                title: kyverno blocked an admission
                summary: A kyverno enforce policy blocked an admission request.
              labels:
                severity: warning
              data:
                - refId: rejections
                  relativeTimeRange: {from: 600, to: 0}
                  datasourceUid: prom
                  model:
                    refId: rejections
                    editorMode: code
                    instant: true
                    # dry_run="false" is NOT optional: without it every
                    # `kubectl apply --dry-run=server` against a violating
                    # manifest would page. policy_validation_mode="enforce"
                    # keeps the Audit tier out.
                    expr: >-
                      sum by (resource_namespace, policy_name, rule_name, resource_kind, resource_request_operation)
                      (increase(kyverno_policy_results_total{
                        rule_result="fail",
                        policy_validation_mode="enforce",
                        rule_execution_cause="admission_request",
                        dry_run="false"
                      }[10m]))
                - refId: fired
                  relativeTimeRange: {from: 600, to: 0}
                  datasourceUid: __expr__
                  model:
                    refId: fired
                    type: threshold
                    expression: rejections
                    conditions:
                      - evaluator: {type: gt, params: [0]}

        - orgId: 1
          name: battery
          folder: alerts
          interval: 5m
          rules:
            # The midpoint of a series string should sit at half the pack
            # voltage. Sustained drift means the two halves are diverging,
            # which is the failure a single pack-voltage reading cannot show:
            # 28.3 V looks healthy whether it is 14.15 + 14.15 or 13.6 + 14.7.
            #
            # Thresholds come from measurement, not guesswork. Over one full
            # charge cycle the absolute deviation was:
            #
            #   pack 26.8-27.1 V (at rest)      0.003 - 0.023 V
            #   pack 27.6 V      (rising)       0.184 V
            #   pack 28.3 V      (absorption)   0.52 - 0.58 V, peak 0.69 V
            #   pack 26.9 V      (charge over)  0.048 - 0.086 V
            #
            # So the fault only appears at the top of charge, and 0.35 V sits
            # in the empty gap between the two populations. Alerting on the
            # shunt's own `alarm_reason` was the alternative and was rejected:
            # it was observed clearing at a LARGER deviation than it set at, so
            # its hysteresis would make the alert flap.
            - uid: battery-midpoint-deviation
              title: BatteryMidpointDeviation
              condition: fired
              # Absorption lasts tens of minutes and the deviation is noisy
              # within it, so a single excursion should not notify.
              for: 15m
              annotations:
                title: battery bank midpoint is drifting
                summary: >-
                  One half of the 24V series string is diverging from the other
                  under charge. Check cell balance before the weaker half is
                  pushed further.
              labels:
                severity: warning
              data:
                - refId: deviation
                  relativeTimeRange: {from: 1800, to: 0}
                  datasourceUid: aeiuudh9knklcd
                  model:
                    refId: deviation
                    format: time_series
                    rawQuery: true
                    # abs() so a drift in either direction alerts -- which half
                    # is high depends on which battery is weaker, and that can
                    # change.
                    rawSql: >-
                      SELECT time, abs(aux_value - battery_voltage / 2) AS value
                      FROM sensors.victron_battery_monitor
                      WHERE $__timeFilter(time)
                        AND aux_input_type = 'midpoint voltage'
                      ORDER BY time
                - refId: worst
                  relativeTimeRange: {from: 1800, to: 0}
                  datasourceUid: __expr__
                  model:
                    refId: worst
                    type: reduce
                    # max, not mean: a half-hour window that is mostly at rest
                    # would average a real absorption excursion away.
                    reducer: max
                    expression: deviation
                - refId: fired
                  relativeTimeRange: {from: 1800, to: 0}
                  datasourceUid: __expr__
                  model:
                    refId: fired
                    type: threshold
                    expression: worst
                    conditions:
                      - evaluator: {type: gt, params: [0.35]}

        - orgId: 1
          name: sensors
          folder: alerts
          interval: 5m
          rules:
            # Alerts on silence. Every other alert in this file describes
            # something the data SAYS; this one describes the data not being
            # there at all, which is the failure nobody notices.
            #
            # On 2026-08-02 the collector host lost Wi-Fi at 07:00 and nothing
            # reported it. It was found by a human at 13:47, 6h47m later. At
            # 09:00 this query would already have returned 120.
            #
            # This covers sensors.litime and nothing else. It used to be
            # described as covering the Victron tables too, on the grounds that
            # the same container writes all three -- and on 2026-08-07 that
            # assumption cost 17 hours. The adapter stopped hearing
            # advertisements while established connections kept working, so both
            # Victron devices and one of the two batteries went silent while the
            # other battery held its connection and kept this query fresh. Host
            # online, container up, database reachable, alert green, half the
            # sensors dead.
            #
            # One table is a liveness signal for one writer. The Victron tables
            # have their own rules below; BirdNET, which runs in its own
            # container on its own schedule, still has none.
            - uid: sensor-data-stale
              title: SensorDataStale
              condition: fired
              # 20 minutes is over a hundred times the normal write interval,
              # so this cannot fire on jitter. With `for`, a notification
              # arrives about 25 minutes into an outage -- late enough to
              # ignore a reboot, early enough to matter.
              for: 5m
              annotations:
                title: sensor readings have stopped
                summary: >-
                  No new rows in sensors.litime. The collector host is offline,
                  its container is dead, or the database is unreachable.
              labels:
                severity: warning
              # If the datasource cannot be queried, that is itself a reason to
              # notify: an unanswerable question about liveness is not a
              # healthy answer. Same for no data at all.
              execErrState: Alerting
              noDataState: Alerting
              data:
                - refId: staleness
                  relativeTimeRange: {from: 3600, to: 0}
                  datasourceUid: aeiuudh9knklcd
                  model:
                    refId: staleness
                    format: time_series
                    rawQuery: true
                    # Deliberately unbounded by $__timeFilter. The question is
                    # "how old is the newest row", and a windowed query returns
                    # nothing once the outage is longer than the window --
                    # which is exactly when the answer matters most.
                    rawSql: >-
                      SELECT now() AS time,
                             extract(epoch from (now() - max(time))) / 60 AS value
                      FROM sensors.litime
                - refId: latest
                  relativeTimeRange: {from: 3600, to: 0}
                  datasourceUid: __expr__
                  model:
                    refId: latest
                    type: reduce
                    reducer: last
                    expression: staleness
                - refId: fired
                  relativeTimeRange: {from: 3600, to: 0}
                  datasourceUid: __expr__
                  model:
                    refId: fired
                    type: threshold
                    expression: latest
                    conditions:
                      - evaluator: {type: gt, params: [20]}

            # The two Victron devices, watched separately from the batteries
            # and from each other.
            #
            # They are the most sensitive indicator of the receive path being
            # broken, and the reason is that they are passive broadcasters.
            # A battery is connected: once a GATT link is up it survives a
            # radio that can no longer hear advertisements, which is precisely
            # how the 2026-08-07 outage stayed invisible. A Victron device has
            # no link to survive on. If discovery stops working, these two go
            # quiet immediately.
            #
            # Two rules rather than one query over both tables. Grouping them
            # would rebuild the same blind spot one level down -- the shunt
            # could die while the charger kept the pair looking alive.
            #
            # 20 minutes matches SensorDataStale and is roughly twenty times
            # the observed arrival rate of about one decoded advertisement per
            # device per minute.
            - uid: victron-solar-stale
              title: VictronSolarDataStale
              condition: fired
              for: 5m
              annotations:
                title: solar charger readings have stopped
                summary: >-
                  No new rows in sensors.victron. The SmartSolar charger is not
                  being heard: the Bluetooth adapter has stopped receiving
                  advertisements, or the charger is off.
              labels:
                severity: warning
                device: smartsolar
              execErrState: Alerting
              noDataState: Alerting
              data:
                - refId: staleness
                  relativeTimeRange: {from: 3600, to: 0}
                  datasourceUid: aeiuudh9knklcd
                  model:
                    refId: staleness
                    format: time_series
                    rawQuery: true
                    # Unbounded by $__timeFilter for the same reason as
                    # SensorDataStale: a windowed query returns nothing once
                    # the outage outlasts the window, which is when it matters.
                    rawSql: >-
                      SELECT now() AS time,
                             extract(epoch from (now() - max(time))) / 60 AS value
                      FROM sensors.victron
                - refId: latest
                  relativeTimeRange: {from: 3600, to: 0}
                  datasourceUid: __expr__
                  model:
                    refId: latest
                    type: reduce
                    reducer: last
                    expression: staleness
                - refId: fired
                  relativeTimeRange: {from: 3600, to: 0}
                  datasourceUid: __expr__
                  model:
                    refId: fired
                    type: threshold
                    expression: latest
                    conditions:
                      - evaluator: {type: gt, params: [20]}

            - uid: victron-shunt-stale
              title: VictronShuntDataStale
              condition: fired
              for: 5m
              annotations:
                title: battery monitor readings have stopped
                summary: >-
                  No new rows in sensors.victron_battery_monitor. The SmartShunt
                  is not being heard: the Bluetooth adapter has stopped
                  receiving advertisements, or the shunt is unpowered.
              labels:
                severity: warning
                device: shunt
              execErrState: Alerting
              noDataState: Alerting
              data:
                - refId: staleness
                  relativeTimeRange: {from: 3600, to: 0}
                  datasourceUid: aeiuudh9knklcd
                  model:
                    refId: staleness
                    format: time_series
                    rawQuery: true
                    rawSql: >-
                      SELECT now() AS time,
                             extract(epoch from (now() - max(time))) / 60 AS value
                      FROM sensors.victron_battery_monitor
                - refId: latest
                  relativeTimeRange: {from: 3600, to: 0}
                  datasourceUid: __expr__
                  model:
                    refId: latest
                    type: reduce
                    reducer: last
                    expression: staleness
                - refId: fired
                  relativeTimeRange: {from: 3600, to: 0}
                  datasourceUid: __expr__
                  model:
                    refId: fired
                    type: threshold
                    expression: latest
                    conditions:
                      - evaluator: {type: gt, params: [20]}

            # The camera is the one collector whose silence is genuinely
            # invisible: a successful upload run against an empty spool logs
            # nothing, so "working" and "not running at all" produce identical
            # journal output. This is the metric that tells them apart.
            #
            # Unlike SensorDataStale this reads Mimir rather than Postgres,
            # because the camera writes to Cloud Storage and never touches the
            # database. The Pi publishes the timestamp of its last successful
            # upload through alloy's textfile collector.
            - uid: camera-upload-stale
              title: CameraUploadStale
              condition: fired
              # Frames are captured every 10 minutes and uploaded every 5, so
              # 45 minutes is four missed cycles. Long enough to ride out a
              # reboot or a brief Wi-Fi drop -- both of which this host does --
              # and short enough to catch a real stall the same hour.
              for: 15m
              annotations:
                title: camera frames have stopped reaching cloud storage
                summary: >-
                  No successful camera upload for 45 minutes. The capture timer,
                  the upload timer, the network, or the write credential has
                  failed.
              labels:
                severity: warning
              # If the series is absent entirely the Pi is not reporting at all,
              # which is a worse version of the same problem rather than a
              # reason to stay quiet.
              execErrState: Alerting
              noDataState: Alerting
              data:
                - refId: age
                  relativeTimeRange: {from: 3600, to: 0}
                  datasourceUid: prom
                  model:
                    refId: age
                    editorMode: code
                    instant: true
                    # Minutes since the last successful upload. The metric is a
                    # unix timestamp rather than a counter precisely so this
                    # stays true across restarts of alloy and of the Pi.
                    expr: >-
                      (time() - camera_upload_last_success_timestamp_seconds) / 60
                - refId: worst
                  relativeTimeRange: {from: 3600, to: 0}
                  datasourceUid: __expr__
                  model:
                    refId: worst
                    type: reduce
                    reducer: max
                    expression: age
                - refId: fired
                  relativeTimeRange: {from: 3600, to: 0}
                  datasourceUid: __expr__
                  model:
                    refId: fired
                    type: threshold
                    expression: worst
                    conditions:
                      - evaluator: {type: gt, params: [45]}

  # env:
  #   - name: "GF_PANELS_DISABLE_SANITIZE_HTML"
  #     value: "true"

  plugins:
    - https://grafana.com/api/plugins/operato-windrose-panel/versions/1.2.0/download;operato-windrose-panel

  grafana.ini:
    feature_toggles:
      provisioning: true
      kubernetesDashboards: true
    server:
      root_url: https://${SUB_SENIOR_ABLE}.${DOMAIN_CORONET_SUMMIT}

  # -- Grafana data sources config. Connects to all three by default
  datasources:
    datasources.yaml:
      apiVersion: 1
      # -- Datasources linked to the Grafana instance. Override if you disable any components.
      datasources:
        # https://grafana.com/docs/grafana/latest/datasources/loki/#provision-the-loki-data-source
        - name: Loki
          uid: loki
          type: loki
          url: http://{{ .Release.Name }}-loki-gateway
          isDefault: false
        # https://grafana.com/docs/grafana/latest/datasources/prometheus/#provision-the-data-source
        - name: Mimir
          uid: prom
          type: prometheus
          url: http://{{ .Release.Name }}-mimir-nginx/prometheus
          isDefault: true
        # https://grafana.com/docs/grafana/latest/datasources/tempo/configure-tempo-data-source/#provision-the-data-source
        - name: Tempo
          uid: tempo
          type: tempo
          url: http://{{ .Release.Name }}-tempo-query-frontend:3100
          isDefault: false
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
            lokiSearch:
              datasourceUid: loki
            tracesToMetrics:
              datasourceUid: prom
            serviceMap:
              datasourceUid: prom

loki:
  # -- Deploy Loki if enabled. See [upstream readme](https://github.com/grafana/helm-charts/tree/main/charts/loki-distributed#values) for full values reference.
  enabled: true

  distributor:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "3100"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 30m
        memory: 100Mi
      limits:
        cpu: 200m
        memory: 150Mi

  gateway:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 5m
        memory: 20Mi
      limits:
        cpu: 50m
        memory: 50Mi

  loki:
    # auth_enabled: false
    schemaConfig:
      configs:
        - from: "2024-04-01"
          index:
            period: 24h
            prefix: loki_index_
          object_store: gcs
          schema: v13
          store: tsdb
    storageConfig:
      boltdb_shipper:
        shared_store: gcs
        active_index_directory: /var/loki/index
        cache_location: /var/loki/cache
        cache_ttl: 1h
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache
      gcs:
        bucket_name: lfpr-p-gcsb-usw1-loki-chunks-l2lw-134f300
    structuredConfig:
      auth_enabled: false
      ruler:
        alertmanager_url: http://localhost
        enable_api: true
        storage:
          type: gcs
          gcs:
            bucket_name: lfpr-p-gcsb-usw1-loki-ruler-l2lw-1db580e
      # Logs had no retention at all: no limits_config, no compactor retention,
      # and no compactor running. Chunks accumulated in GCS permanently. At the
      # measured 0.7 GiB/day that is 22 GiB a month, forever -- the only cost
      # here that grows without bound rather than reaching a steady state.
      #
      # 30d matches mimir's compactor_blocks_retention_period, so metrics and
      # the logs explaining them expire together.
      limits_config:
        retention_period: 720h
      compactor:
        working_directory: /var/loki/compactor
        shared_store: gcs
        retention_enabled: true
        compaction_interval: 10m
        # Delay before a deletion is actually performed, so a mistaken
        # retention change can be reverted before data is gone.
        retention_delete_delay: 2h
        retention_delete_worker_count: 150

  ingester:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "3100"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 20m
        memory: 400Mi
      limits:
        cpu: 200m
        memory: 600Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    extraEnv:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json

  compactor:
    # Enabled so retention actually happens. Loki enforces retention in the
    # compactor, and this chart defaults it off -- so before this change no
    # compactor pod existed and retention_period would have deleted nothing
