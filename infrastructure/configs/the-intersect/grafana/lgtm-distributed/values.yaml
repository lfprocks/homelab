  enabled: true

  minio:
    enabled: false

  # Enable OTLP receivers on the distributor. Without this the
  # distributor's `receivers:` block is null and the service only exposes
  # the internal HTTP (3100) and gRPC (9095) ports — no OTLP intake.
  # With this set, the chart adds 4317 (gRPC) and 4318 (HTTP) to the
  # distributor service so cluster apps (and Alloy) can push spans.
  traces:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true

  ingester:
    # Match the ring replication factor to the single tempo ingester. The chart
    # default is 3 (sized for a multi-ingester deployment); with one ingester the
    # querier can never assemble a read quorum, so all trace search failed with
    # "too many unhealthy instances in the ring". Writes were unaffected -- the
    # distributor writes best-effort to whatever ingesters exist. (structuredConfig
    # does not reach this field in tempo-distributed; ingester.config does.)
    config:
      replication_factor: 1
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "3100"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 5m
        memory: 128Mi
      limits:
        cpu: 200m
        # 192Mi still OOMKilled the ingester while completing/flushing a
        # parquet block, which made it UNHEALTHY in the ring and broke all
        # trace search. Give the block build real headroom.
        memory: 512Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
