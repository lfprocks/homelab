---
grafana:
  # -- Deploy Grafana if enabled. See [upstream readme](https://github.com/grafana/helm-charts/tree/main/charts/grafana#configuration) for full values reference.
  enabled: true

  image:
    tag: 12.1.0

  resources:
    requests:
      cpu: 10m
      memory: 150Mi
    limits:
      cpu: 256m
      memory: 512Mi

  persistence:
    enabled: true
    size: 10Gi
    storageClassName: smb-client

  # Dashboard sidecar. Until now every dashboard was UI-created and lived only on
  # the PVC above, so there was no GitOps path for shipping one -- which is part
  # of why the kyverno policy results went unread for so long. The sidecar
  # watches for ConfigMaps labelled `grafana_dashboard: "1"` and loads them, so
  # any chart or manifest in the repo can ship a dashboard.
  #
  # searchNamespace ALL is needed because the dashboards come from the namespace
  # that owns them (kyverno, here), not from grafana's. That means a cluster-wide
  # ConfigMap watch; the sidecar only keeps labelled ConfigMaps, so the overhead
  # is one lightweight informer rather than anything proportional to metrics
  # volume.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        memory: 100Mi

  # Alerting for kyverno ENFORCE rejections -- something was actually blocked at
  # admission, as opposed to the Audit tier which only shows up on the dashboard.
  #
  # Delivery goes through pnp (writer -> pulsar -> deliverer -> pushover), the
  # notification path that is actually consumed. ntfy was removed precisely
  # because nothing read it, and an alert nobody receives is worse than none.
  #
  # Requires two cluster-vars entries. GRAFANA_PNP_TOKEN is already set; add
  # GRAFANA_PUSHOVER_USER_KEY before this can deliver:
  #   SOPS_AGE_KEY_FILE=age.agekey sops clusters/the-intersect/cluster-vars.sops.yaml
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: pnp-pushover
          receivers:
            - uid: pnp-pushover-webhook
              type: webhook
              settings:
                url: http://pnp-writer.pnp.svc.cluster.local/notifications
                httpMethod: POST
                authorization_scheme: Bearer
                authorization_credentials: ${GRAFANA_PNP_TOKEN}
                # pnp-writer rejects Grafana's native alert payload with a 400,
                # so the body is templated into its Notification schema:
                # content{title,body} and pushover{userOrGroupKey} are required.
                # idempotencyKey uses the group key so retries of the same alert
                # collapse inside the writer's 5m idempotency window.
                message: |
                  {
                    "originatingService": "grafana",
                    "idempotencyKey": "{{ .GroupKey }}",
                    "content": {
                      "title": "kyverno blocked {{ len .Alerts.Firing }} admission(s)",
                      "body": {{ (printf "%s" (or .CommonAnnotations.summary .CommonLabels.alertname)) | toJson }},
                      "priority": 0
                    },
                    "pushover": {
                      "userOrGroupKey": "${GRAFANA_PUSHOVER_USER_KEY}"
                    }
                  }

    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: grafana-default-email
          routes:
            - receiver: pnp-pushover
              object_matchers:
                - ["alertname", "=", "KyvernoEnforceRejection"]
              # Grouped so a ReplicaSet retrying a rejected pod does not spam:
              # one notification per namespace+policy rather than per attempt.
              group_by: ["resource_namespace", "policy_name"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h

    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: kyverno
          folder: alerts
          interval: 1m
          rules:
            - uid: kyverno-enforce-rejection
              title: KyvernoEnforceRejection
              condition: fired
              for: 0m
              annotations:
                summary: >-
                  kyverno blocked an admission in {{ $labels.resource_namespace }}
                  ({{ $labels.policy_name }}/{{ $labels.rule_name }},
                  {{ $labels.resource_kind }} {{ $labels.resource_request_operation }})
              labels:
                severity: warning
              data:
                - refId: rejections
                  relativeTimeRange: {from: 600, to: 0}
                  datasourceUid: prom
                  model:
                    refId: rejections
                    editorMode: code
                    instant: true
                    # dry_run="false" is NOT optional: without it every
                    # `kubectl apply --dry-run=server` against a violating
                    # manifest would page. policy_validation_mode="enforce"
                    # keeps the Audit tier out of this.
                    expr: >-
                      sum by (resource_namespace, policy_name, rule_name, resource_kind, resource_request_operation)
                      (increase(kyverno_policy_results_total{
                        rule_result="fail",
                        policy_validation_mode="enforce",
                        rule_execution_cause="admission_request",
                        dry_run="false"
                      }[10m]))
                - refId: fired
                  relativeTimeRange: {from: 600, to: 0}
                  datasourceUid: __expr__
                  model:
                    refId: fired
                    type: threshold
                    expression: rejections
                    conditions:
                      - evaluator: {type: gt, params: [0]}

  # env:
  #   - name: "GF_PANELS_DISABLE_SANITIZE_HTML"
  #     value: "true"

  plugins:
    - https://grafana.com/api/plugins/operato-windrose-panel/versions/1.2.0/download;operato-windrose-panel

  grafana.ini:
    feature_toggles:
      provisioning: true
      kubernetesDashboards: true
    server:
      root_url: https://${SUB_SENIOR_ABLE}.${DOMAIN_CORONET_SUMMIT}

  # -- Grafana data sources config. Connects to all three by default
  datasources:
    datasources.yaml:
      apiVersion: 1
      # -- Datasources linked to the Grafana instance. Override if you disable any components.
      datasources:
        # https://grafana.com/docs/grafana/latest/datasources/loki/#provision-the-loki-data-source
        - name: Loki
          uid: loki
          type: loki
          url: http://{{ .Release.Name }}-loki-gateway
          isDefault: false
        # https://grafana.com/docs/grafana/latest/datasources/prometheus/#provision-the-data-source
        - name: Mimir
          uid: prom
          type: prometheus
          url: http://{{ .Release.Name }}-mimir-nginx/prometheus
          isDefault: true
        # https://grafana.com/docs/grafana/latest/datasources/tempo/configure-tempo-data-source/#provision-the-data-source
        - name: Tempo
          uid: tempo
          type: tempo
          url: http://{{ .Release.Name }}-tempo-query-frontend:3100
          isDefault: false
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
            lokiSearch:
              datasourceUid: loki
            tracesToMetrics:
              datasourceUid: prom
            serviceMap:
              datasourceUid: prom

loki:
  # -- Deploy Loki if enabled. See [upstream readme](https://github.com/grafana/helm-charts/tree/main/charts/loki-distributed#values) for full values reference.
  enabled: true

  distributor:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "3100"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 30m
        memory: 100Mi
      limits:
        cpu: 200m
        memory: 150Mi

  gateway:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 5m
        memory: 20Mi
      limits:
        cpu: 50m
        memory: 50Mi

  loki:
    # auth_enabled: false
    schemaConfig:
      configs:
        - from: "2024-04-01"
          index:
            period: 24h
            prefix: loki_index_
          object_store: gcs
          schema: v13
          store: tsdb
    storageConfig:
      boltdb_shipper:
        shared_store: gcs
        active_index_directory: /var/loki/index
        cache_location: /var/loki/cache
        cache_ttl: 1h
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache
      gcs:
        bucket_name: lfpr-p-gcsb-usw1-loki-chunks-l2lw-134f300
    structuredConfig:
      auth_enabled: false
      ruler:
        alertmanager_url: http://localhost
        enable_api: true
        storage:
          type: gcs
          gcs:
            bucket_name: lfpr-p-gcsb-usw1-loki-ruler-l2lw-1db580e
      # Logs had no retention at all: no limits_config, no compactor retention,
      # and no compactor running. Chunks accumulated in GCS permanently. At the
      # measured 0.7 GiB/day that is 22 GiB a month, forever -- the only cost
      # here that grows without bound rather than reaching a steady state.
      #
      # 30d matches mimir's compactor_blocks_retention_period, so metrics and
      # the logs explaining them expire together.
      limits_config:
        retention_period: 720h
      compactor:
        working_directory: /var/loki/compactor
        shared_store: gcs
        retention_enabled: true
        compaction_interval: 10m
        # Delay before a deletion is actually performed, so a mistaken
        # retention change can be reverted before data is gone.
        retention_delete_delay: 2h
        retention_delete_worker_count: 150

  ingester:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "3100"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 20m
        memory: 400Mi
      limits:
        cpu: 200m
        memory: 600Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    extraEnv:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json

  compactor:
    # Enabled so retention actually happens. Loki enforces retention in the
    # compactor, and this chart defaults it off -- so before this change no
    # compactor pod existed and retention_period would have deleted nothing
    # however it was set.
    enabled: true
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "3100"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    extraEnv:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json

  queryFrontend:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "3100"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 5m
        memory: 40Mi
      limits:
        cpu: 50m
        memory: 80Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    extraEnv:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json

  ruler:
    enabled: true
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "3100"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 10m
        memory: 60Mi
      limits:
        cpu: 100m
        memory: 100Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    extraEnv:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json

  querier:
    enabled: true
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "3100"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        cpu: 100m
        memory: 150Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    extraEnv:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json

  minio:
    enabled: false

# -- Mimir chart values. Resources are set to a minimum by default.
mimir:
  # -- Deploy Mimir if enabled. See [upstream values.yaml](https://github.com/grafana/mimir/blob/main/operations/helm/charts/mimir-distributed/values.yaml) for full values reference.
  enabled: true

  mimir:
    structuredConfig:
      blocks_storage:
        backend: gcs
        storage_prefix: blocks
        gcs:
          bucket_name: lfpr-p-gcsb-usw1-mimir-blocks-9mk8-0274f6f
      alertmanager_storage:
        backend: gcs
        gcs:
          bucket_name: lfpr-p-gcsb-usw1-mimir-alertmanager-0k3e-0000795
      ruler_storage:
        backend: gcs
        gcs:
          bucket_name: lfpr-p-gcsb-usw1-mimir-ruler-l2lw-d0af208
      limits:
        # Delete from storage metrics data older than 30d.
        compactor_blocks_retention_period: 30d
        max_global_series_per_user: 500000

  alertmanager:
    persistentVolume:
      storageClass: smb-client
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        cpu: 100m
        memory: 200Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    env:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json
  compactor:
    persistentVolume:
      storageClass: smb-client
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 15m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 500Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    env:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json
  distributor:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 80m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    env:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json
  ingester:
    persistentVolume:
      storageClass: ceph-block
      size: 10Gi
    replicas: 4
    zoneAwareReplication:
      enabled: false
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    # Sized from measured load rather than the chart defaults. The ingesters
    # hold the active series set in memory: at 32k series each they sit around
    # 350Mi, so an 800Mi ceiling left under 2.5x headroom.
    #
    # That matters because limits.max_global_series_per_user is 500000. With
    # replication_factor 3 across 4 ingesters that is up to 375k series each --
    # more than ten times the current load, and multiple GB of memory. The
    # configured tenant limit and the pod limit disagreed about how big this
    # cluster is allowed to get.
    #
    # The CPU limit is raised for a different reason: WAL replay and block
    # compaction are bursty, and a throttled ingester misses the gRPC health
    # checks the distributor uses, which turns a slow ingester into an apparently
    # dead one.
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        cpu: "1"
        memory: 2Gi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    env:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json
  overrides_exporter:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 5m
        memory: 20Mi
      limits:
        cpu: 20m
        memory: 50Mi
  querier:
    replicas: 1
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 5m
        memory: 120Mi
      limits:
        cpu: 200m
        memory: 200Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    env:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json
  query_frontend:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 5m
        memory: 40Mi
      limits:
        cpu: 50m
        memory: 80Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    env:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json
  query_scheduler:
    replicas: 1
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 5m
        memory: 30Mi
      limits:
        cpu: 50m
        memory: 60Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    env:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json
  ruler:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 50m
        memory: 100Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
