    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    env:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json
  store_gateway:
    persistentVolume:
      storageClass: smb-client
    zoneAwareReplication:
      enabled: false
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 100Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    env:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json
  minio:
    enabled: false
  rollout_operator:
    resources:
      requests:
        cpu: 2m
        memory: 25Mi
      limits:
        cpu: 20m
        memory: 50Mi

tempo:
  # -- Deploy Tempo if enabled.  See [upstream readme](https://github.com/grafana/helm-charts/blob/main/charts/tempo-distributed/README.md#values) for full values reference.
  enabled: true

  minio:
    enabled: false

  # Enable OTLP receivers on the distributor. Without this the
  # distributor's `receivers:` block is null and the service only exposes
  # the internal HTTP (3100) and gRPC (9095) ports — no OTLP intake.
  # With this set, the chart adds 4317 (gRPC) and 4318 (HTTP) to the
  # distributor service so cluster apps (and Alloy) can push spans.
  traces:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true

  ingester:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "3100"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 5m
        memory: 60Mi
      limits:
        cpu: 50m
        memory: 100Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    extraEnv:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json

  compactor:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "3100"
      prometheus.io/scrape: "true"
      prometheus.istio.io/merge-metrics: "false"
    resources:
      requests:
        cpu: 5m
        memory: 60Mi
      limits:
        cpu: 50m
        memory: 100Mi
    extraVolumes:
      - name: lgtm-distributed-service-account-secret
        secret:
          secretName: lgtm-distributed-service-account-secret
    extraVolumeMounts:
      - name: lgtm-distributed-service-account-secret
        mountPath: /etc/service-account
        readOnly: true
    extraEnv:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/service-account/service-account.json

  distributor:
