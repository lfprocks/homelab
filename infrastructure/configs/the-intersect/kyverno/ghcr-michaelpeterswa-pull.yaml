# Pull credentials for private ghcr.io/michaelpeterswa/* images, everywhere.
#
# Same shape as forgejo-registry-pull.yaml. The source Secret
# (ghcr-michaelpeterswa-pull.sops.yaml, in this namespace) holds a GHCR
# read-only (read:packages) token.
#   1. generate: Kyverno clones it into every namespace and keeps it in sync,
#      so rotating the token is one sops edit.
#   2. mutate: any Pod with an image under ghcr.io/michaelpeterswa/ gets it in
#      imagePullSecrets. Pods only (autogen off), so Deployments in git are
#      never rewritten and Flux never sees drift.
# imagePullSecrets is a strategic-merge list keyed on name, so a Pod matching
# both this and forgejo-registry-pull (or carrying its own pull secret) ends
# up with every entry rather than one replacing the other.
# Apps need nothing: reference the image and it pulls.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ghcr-michaelpeterswa-pull
  annotations:
    policies.kyverno.io/title: GHCR (michaelpeterswa) pull credentials
    policies.kyverno.io/subject: Pod, Secret
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  generateExisting: true
  rules:
    - name: clone-pull-secret
      match:
        any:
          - resources:
              kinds: [Namespace]
      exclude:
        any:
          - resources:
              names: [kyverno]
      generate:
        apiVersion: v1
        kind: Secret
        name: ghcr-michaelpeterswa-pull
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        clone:
          namespace: kyverno
          name: ghcr-michaelpeterswa-pull
    - name: add-pull-secret-containers
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE]
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - <(image): "ghcr.io/michaelpeterswa/*"
            imagePullSecrets:
              - name: ghcr-michaelpeterswa-pull
    - name: add-pull-secret-init-containers
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE]
      mutate:
        patchStrategicMerge:
          spec:
            initContainers:
              - <(image): "ghcr.io/michaelpeterswa/*"
            imagePullSecrets:
              - name: ghcr-michaelpeterswa-pull
