apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: grafana-data
  namespace: grafana
spec:
  sourcePVC: grafana-data
  trigger:
    schedule: 40 3 * * *
  restic:
    repository: restic-grafana-data
    copyMethod: Snapshot
    volumeSnapshotClassName: ceph-block
    storageClassName: ceph-block
    accessModes:
    - ReadWriteOnce
    cacheCapacity: 1Gi
    cacheStorageClassName: ceph-block
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    moverSecurityContext:
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    moverPodLabels:
      k8s.lfp.rocks/service: volsync-mover
      k8s.lfp.rocks/version: 0.16.0
    moverResources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 1Gi
