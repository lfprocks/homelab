---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: main-pool
spec:
  blocks:
    - start: "${CILIUM_LBIPAM_START}"
      stop: "${CILIUM_LBIPAM_STOP}"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: main-pool-l2
spec:
  # Cilium ignores node.kubernetes.io/exclude-from-external-load-balancers for
  # L2 announcements, so keep LoadBalancer ARP off the control planes here.
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  loadBalancerIPs: true
  externalIPs: true
