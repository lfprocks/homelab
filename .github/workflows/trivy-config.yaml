name: trivy-config

# ADVISORY Kubernetes manifest scanning (privileged pods, hostPath, root
# containers, RBAC breadth, ...). Results go to the Security tab as code
# scanning alerts; this never fails a PR. Kyverno enforces the hard rules at
# admission. Pinned, checksum-verified binary.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 1" # weekly, Monday, so new Trivy checks get applied

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the manifests
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install trivy
        env:
          # renovate: datasource=github-release-attachments depName=aquasecurity/trivy
          TRIVY_VERSION: v0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          f="trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          curl -sfLO "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/${f}"
          echo "${TRIVY_SHA256}  ${f}" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar xzf "$f" -C "$HOME/bin" trivy
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # Skips: archived/inactive clusters and vendored Gateway API CRDs.
      - name: Scan manifests
        run: |
          trivy config . \
            --skip-dirs _archive,.claude,infrastructure/configs/libvirt-unraid,apps/shallenge-miner \
            --skip-files '**/crds.yaml' \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format sarif --output trivy-config.sarif

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
