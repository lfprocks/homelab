name: renovate-approved

# Approving a Renovate PR is the merge decision. The approval can come from the
# GitHub UI or from openclaw over Telegram (it reviews as the owner through a
# fine-grained PAT that cannot push or merge). This turns on auto-merge, and
# GitHub merges once the required `validate` check passes.
#
# Only Renovate's PRs, and only the owner's approval, count. Other
# collaborators' approvals and everyone else's PRs are untouched.
#
# Renovate pushing to an approved PR (a rebase) makes GitHub turn auto-merge
# off again, which left #160 approved but never merged. So a push to a Renovate
# PR re-enables auto-merge too -- but only if the owner's latest review is an
# approval AND the update is the same one that was approved. Renovate's commit
# title names the target version ("update X to v15.1.0"), so a title change
# means a different update, which needs a fresh approval.

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' && (
        (github.event_name == 'pull_request_review' &&
         github.event.review.state == 'approved' &&
         github.event.review.user.login == 'michaelpeterswa') ||
        github.event_name == 'pull_request'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check the approval still applies
        if: github.event_name == 'pull_request'
        id: check
        run: |
          approved=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '[.[] | select(.user.login == "michaelpeterswa" and .state != "COMMENTED")] | last | select(.state == "APPROVED") | .commit_id')
          if [ -z "$approved" ]; then
            echo "No standing approval from the owner; nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          was=$(gh api "repos/$REPO/commits/$approved" --jq '.commit.message | split("\n")[0]') || was=""
          now=$(gh api "repos/$REPO/commits/$HEAD" --jq '.commit.message | split("\n")[0]')
          if [ -z "$was" ] || [ "$was" != "$now" ]; then
            echo "Update changed since approval (\"$was\" -> \"$now\"); needs a fresh approval."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Same update as approved (\"$now\"); re-enabling auto-merge."
          echo "proceed=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}

      # Enable auto-merge if validate is still running. If GitHub refuses
      # (the PR is already mergeable, or "unstable" from an earlier failed
      # run), merge directly. The main ruleset still requires validate, and
      # this token can't bypass it.
      #
      # Approvals often arrive in a burst ("approve low"), and parallel merges
      # race on main ("Base branch was modified"), so retry with jitter. No
      # concurrency group: GitHub keeps only one pending run per group and
      # cancels the rest, which would drop approvals.
      - name: Merge
        if: github.event_name == 'pull_request_review' || steps.check.outputs.proceed == 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            gh pr merge --auto --squash "$PR_URL" && exit 0
            gh pr merge --squash "$PR_URL" && exit 0
            delay=$((10 + RANDOM % 20))
            echo "attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
