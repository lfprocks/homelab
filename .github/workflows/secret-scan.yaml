name: secret-scan

# Blocks plaintext credentials from landing in this public repo. Runs gitleaks
# over the commits a PR adds (so a secret added and then removed within the PR
# is still caught) and over the resulting tree. Required status check on main.
#
# Not gitleaks/gitleaks-action: it needs a paid license for org-owned repos.
# The binary is pinned and checksum-verified instead.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per PR/branch; a newer push supersedes an older PR run. Runs on main
# are never cancelled, so every merged commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar xzf "$f" -C "$HOME/bin" gitleaks
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # The config is read from the BASE commit, never from the PR: otherwise a
      # PR could add an allowlist to .gitleaks.toml and exempt its own leak.
      # Config changes therefore only take effect once merged.
      - name: Load config from base
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          cfg="$RUNNER_TEMP/gitleaks.toml"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && git show "$BASE:.gitleaks.toml" > "$cfg" 2>/dev/null; then
            echo "using .gitleaks.toml from base ${BASE::7}"
          else
            printf '[extend]\nuseDefault = true\n' > "$cfg"
            echo "no base config; using gitleaks defaults"
          fi
          echo "GITLEAKS_CONFIG_FILE=$cfg" >> "$GITHUB_ENV"

      - name: Scan new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit; skipping range scan (tree scan still runs)"; exit 0
          fi
          gitleaks git . --config "$GITLEAKS_CONFIG_FILE" --redact --no-banner --verbose \
            --log-opts="${BASE}..${HEAD}"

      - name: Scan tree
        run: gitleaks dir . --config "$GITLEAKS_CONFIG_FILE" --redact --no-banner --verbose
