name: secret-scan

# Blocks plaintext credentials from landing in this public repo. Runs gitleaks
# over the commits a PR adds (so a secret added and then removed within the PR
# is still caught) and over the resulting tree. Required status check on main.
#
# Not gitleaks/gitleaks-action: it needs a paid license for org-owned repos.
# The binary is pinned and checksum-verified instead.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar xzf "$f" -C "$HOME/bin" gitleaks
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Scan new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit; skipping range scan (tree scan still runs)"; exit 0
          fi
          gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose \
            --log-opts="${BASE}..${HEAD}"

      - name: Scan tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose
