    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-wsdot
  labels:
    k8s.lfp.rocks/policy: enforce
    # Cluster-internal MCP server (no shared-gateway-access): reached via its
    # ClusterIP Service, not the shared ingress gateway. Runs fully hardened
    # and non-root, so it can enforce the restricted Pod Security Standard.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
