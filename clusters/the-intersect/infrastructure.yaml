# Infrastructure, split into groups so one broken component only blocks
# what actually needs it (plan 5, 2026-10-07). Directories under
# infrastructure/groups/ only list members; the manifests stay where they were.
# Apps depend on the -config groups they need; see apps.yaml.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-network
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/groups/the-intersect/infra-network
  prune: false
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
    - kind: Secret
      name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-certs
  namespace: flux-system
spec:
  interval: 1h
