apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: glance

resources:
  - deployment.yaml
  - httproute.yaml
  - oauth2-proxy-config.yaml
  - oauth2-proxy-secret.yaml
  - oauth2-proxy-emails-secret.yaml

components:
  - ../../../components/oauth2-proxy

configMapGenerator:
  - name: glance-web-config
    # Left open to Flux postBuild substitution so the service links can use
    # cluster-vars codenames. Do not use glance's own ${ENV} syntax in glance.yml:
    # Flux would replace it first.
    files:
      - glance.yml

labels:
  - includeSelectors: true
    pairs:
      env: prod
      proj: glance
