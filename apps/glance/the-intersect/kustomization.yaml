apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: glance

resources:
  - deployment.yaml
  - httproute.yaml
  - oauth2-proxy-config.yaml
  - oauth2-proxy-secret.yaml
  - oauth2-proxy-emails-secret.yaml

components:
  - ../../../components/oauth2-proxy

configMapGenerator:
  - name: glance-web-config
    files:
      - glance.yml
    options:
      annotations:
        # glance expands ${ENV} in its own config; keep Flux from blanking those.
        kustomize.toolkit.fluxcd.io/substitute: disabled

labels:
  - includeSelectors: true
    pairs:
      env: prod
      proj: glance
