---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glance-web-httproute
spec:
  parentRefs:
    - name: external-gateway-https
      namespace: cilium-ingress
  hostnames: ["${SUB_CORONET_ORCHARD}.${DOMAIN_CORONET_SUMMIT}"]
  rules:
    - backendRefs:
        # route through the oauth2-proxy sidecar (Pocket-ID OIDC) instead of
        # straight to glance -- see components/oauth2-proxy.
        - name: glance-web
          port: 4180
