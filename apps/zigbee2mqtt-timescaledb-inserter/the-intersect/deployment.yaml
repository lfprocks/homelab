---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee2mqtt-timescaledb-inserter-env-configmap
data:
  LOG_LEVEL: info
  # EMQX allows anonymous clients in-cluster (same as zigbee2mqtt itself).
  MQTT_ADDRESS: tcp://emqx.emqx.svc.cluster.local:1883
  MQTT_BASE_TOPIC: zigbee2mqtt
  METRICS_ENABLED: "true"
  METRICS_PORT: "8081"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name zigbee2mqtt-timescaledb-inserter
  labels:
    app: *name
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # One subscriber only: a second replica would insert every reading twice.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
        k8s.lfp.rocks/service: "zigbee2mqtt-timescaledb-inserter"
        k8s.lfp.rocks/version: "v1.1.1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8081"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: *name
          image: ghcr.io/michaelpeterswa/zigbee2mqtt-timescaledb-inserter:v1.1.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: zigbee2mqtt-timescaledb-inserter-env-configmap
            - secretRef:
                name: zigbee2mqtt-timescaledb-inserter-env-secret
          ports:
            - name: metrics
              containerPort: 8081
          # No health endpoint. The metrics listener starts before the database
          # and broker connections, so this only shows the process is alive;
          # a failed connection at startup exits the process instead.
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
