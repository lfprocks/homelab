---
apiVersion: v1
kind: Service
metadata:
  name: mcp-brave-x402
  namespace: mcp-brave-x402
  labels:
    app: mcp-brave-x402
spec:
  # Cluster-internal only. The MCP endpoint is reached at
  # http://mcp-brave-x402.mcp-brave-x402.svc.cluster.local:8080/mcp
  type: ClusterIP
  selector:
    app: mcp-brave-x402
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 8081
      targetPort: metrics
      protocol: TCP
