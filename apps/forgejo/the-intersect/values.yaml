global:
  storageClass: "ceph-block"

## @param replicaCount number of replicas for the deployment
replicaCount: 1

# Forgejo's gitea-shared-storage PVC is ReadWriteOnce, so two pods can never
# hold it at once. The chart defaults to RollingUpdate with maxSurge 100% and
# maxUnavailable 0, which is the one combination guaranteed to deadlock on RWO:
# the new pod is created first and the old one may not terminate until the new
# one is Ready, so the new pod sits in Init forever with
#
#     Multi-Attach error for volume "pvc-..." Volume is already used by pod(s) ...
#
# and the Helm upgrade eventually fails with "client rate limiter Wait returned
# an error: context deadline exceeded".
#
# This is latent in any forgejo pod-template change, not specific to one --
# adding the k8s.lfp.rocks pod labels is simply what tripped it first. Recreate
# terminates the old pod before starting the new one, which costs a short gap
# but actually completes. Same reasoning as outline, which sets Recreate for
# exactly this reason.
strategy:
  type: Recreate

service:
  ssh:
    type: LoadBalancer
    port: 22
    # Dedicated IP. This previously shared ${EXTERNAL_GATEWAY_HTTPS_IP} with
    # the external gateway via a sharing-key, but Cilium L2 announcements
    # take a lease per Service (not per IP), so the two leases can land on
    # different nodes and ARP-fight over the shared IP, causing intermittent
    # ECONNRESET on every hostname behind the gateway.
    annotations:
      lbipam.cilium.io/ips: "${FORGEJO_SSH_IP}"

# Enables Gateway API HTTPRoute as a replacement for traditional Ingress resources
## @section Gateway-API HTTPRoute
## @param httpRoute.enabled Enables Gateway API HTTPRoute as a replacement for traditional Ingress resources
## @param httpRoute.annotations Annotations to add to the HTTPRoute resource
## @param httpRoute.parentRefs List of parentRefs for the HTTPRoute, typically referencing the Gateway(name, namespace)
## @param httpRoute.hostnames Hostnames this HTTPRoute applies to
## @param httpRoute.matches.path.type Type of path match (e.g., PathPrefix or Exact or RegularExpression)
## @param httpRoute.matches.path.value Path value for matching incoming requests
## @param httpRoute.matches.timeouts Object containing timeouts.
## @param httpRoute.filters Filters to apply on HTTP requests, such as header rewrites or request redirects
httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: external-gateway-https
      namespace: cilium-ingress
  hostnames:
    - ${SUB_COBRA_TIDE}.${DOMAIN_CORONET_SUMMIT}
  matches:
    path:
      type: PathPrefix
      value: "/"
    timeouts: {}
  filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
          - name: X-Forwarded-Proto
            value: https
## @section deployment
#
## @param resources Kubernetes resources
resources:
  limits:
    cpu: 800m
    memory: 768Mi
  requests:
    cpu: 25m
    memory: 256Mi

## @section Persistence
#
## @param persistence.enabled Enable persistent storage
## @param persistence.create Whether to create the persistentVolumeClaim for shared storage
## @param persistence.mount Whether the persistentVolumeClaim should be mounted (even if not created)
## @param persistence.claimName Use an existing claim to store repository information
## @param persistence.size Size for persistence to store repo information
## @param persistence.accessModes AccessMode for persistence
## @param persistence.labels Labels for the persistence volume claim to be created
## @param persistence.annotations.helm.sh/resource-policy Resource policy for the persistence volume claim
## @param persistence.storageClass Name of the storage class to use
## @param persistence.subPath Subdirectory of the volume to mount at
## @param persistence.volumeName Name of persistent volume in PVC
persistence:
  enabled: true
  storageClass: ceph-block

# Configure commit/action signing prerequisites
## @section Signing
#
## @param signing.enabled Enable commit/action signing
## @param signing.gpgHome GPG home directory
## @param signing.privateKey Inline private GPG key for signed internal Git activity
## @param signing.existingSecret Use an existing secret to store the value of `signing.privateKey`
signing:
  enabled: false
  gpgHome: /data/git/.gnupg
  privateKey: ""
  # privateKey: |-
  #   -----BEGIN PGP PRIVATE KEY BLOCK-----
  #   ...
  #   -----END PGP PRIVATE KEY BLOCK-----
  existingSecret: ""

## @section Gitea
#
gitea:
  admin:
    username: intersect-admin
    # password is provided via the SOPS-encrypted forgejo-values-secret (valuesFrom).
    # Break-glass only: password login is disabled (see ACCESS.md).
    email: "admin@${DOMAIN_CORONET_SUMMIT}"
    passwordMode: keepUpdated

  ## @param gitea.podAnnotations Annotations for the Forgejo pod
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "6060"
    prometheus.istio.io/merge-metrics: "false"

  ## @param gitea.ssh.logLevel Configure OpenSSH's log level. Only available for root-based Forgejo image.
  ssh:
    logLevel: "INFO"

  # Pocket-ID OIDC. The chart re-applies this on every start (add-oauth /
  # update-oauth), so the auth source is declared here rather than living only
  # in the database. Client ID/secret: pocket-id-oauth.sops.yaml.
  # Sign-in requires the Pocket-ID group forgejo-users; forgejo-admins grants
  # Forgejo admin. No skipLocal2fa: the chart renders booleans as a separate
  # "true" argument, which the CLI rejects (unexpected arguments: true) and
  # would fail the init container. It only matters for accounts with Forgejo
  # TOTP enrolled, and there are none.
  oauth:
    - name: pocket-id
      provider: openidConnect
      existingSecret: forgejo-pocket-id
      autoDiscoverUrl: https://${SUB_AMBER_MERIDIAN}.${DOMAIN_CORONET_SUMMIT}/.well-known/openid-configuration
      scopes: "openid email profile groups"
      groupClaimName: groups
      adminGroup: forgejo-admins
      requiredClaimName: groups
      requiredClaimValue: forgejo-users

  additionalConfigFromEnvs:
    - name: FORGEJO__database__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-postgres-app
          key: password
    # Package registry blobs on Ceph RGW (objectbucketclaim.yaml). Rook
    # generates the forgejo-packages Secret; the section name is pre-escaped
    # the way the chart escapes config keys ('.' -> _0X2E_).
    - name: FORGEJO__storage_0X2E_packages__MINIO_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: forgejo-packages
          key: AWS_ACCESS_KEY_ID
    - name: FORGEJO__storage_0X2E_packages__MINIO_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: forgejo-packages
          key: AWS_SECRET_ACCESS_KEY

  config:
    APP_NAME: "Intersect Computer Git"
    # Access model: Pocket-ID SSO is the way in (gitea.oauth below). Local
    # registration is closed (it was open to the internet by default) and
    # nothing is visible without signing in.
    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: true
      # Pocket-ID only. No password sign-in on the web (403 for everyone,
      # admins included) and no password over HTTP Basic auth (API, git over
      # HTTPS, registry): access tokens still work as the Basic-auth password.
      # Break-glass for intersect-admin: see ACCESS.md.
      ENABLE_INTERNAL_SIGNIN: false
      ENABLE_BASIC_AUTHENTICATION: false
      DEFAULT_KEEP_EMAIL_PRIVATE: true
    # First Pocket-ID login creates the account, or links an existing local
    # account whose email/username matches.
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: true
      ACCOUNT_LINKING: auto
      UPDATE_AVATAR: true
    openid:
      ENABLE_OPENID_SIGNIN: false
      ENABLE_OPENID_SIGNUP: false
    api:
      ENABLE_SWAGGER: false
    # Runners: apps/forgejo-runners. `uses: actions/checkout@v4` resolves on
    # github.com, so mirrored GitHub workflows run unchanged.
    actions:
      ENABLED: true
      DEFAULT_ACTIONS_URL: github
    server:
      DOMAIN: ${SUB_COBRA_TIDE}.${DOMAIN_CORONET_SUMMIT}
      ROOT_URL: https://${SUB_COBRA_TIDE}.${DOMAIN_CORONET_SUMMIT}
      HTTP_PORT: 3000
      SSH_DOMAIN: ${SUB_COBRA_TIDE}.${DOMAIN_CORONET_SUMMIT}
      SSH_PORT: 22 # advertised in clone URLs
      SSH_LISTEN_PORT: 2222 # rootless image sshd listens here
    database:
      DB_TYPE: postgres
      HOST: forgejo-postgres-rw.forgejo.svc.cluster.local:5432
      NAME: forgejo
      USER: forgejo
      SCHEMA: public
      SSL_MODE: disable
    cache:
      ADAPTER: redis
      HOST: redis://forgejo-dragonfly.forgejo.svc.cluster.local:6379/0
    session:
      PROVIDER: redis
      PROVIDER_CONFIG: redis://forgejo-dragonfly.forgejo.svc.cluster.local:6379/1
    queue:
      TYPE: redis
      CONN_STR: redis://forgejo-dragonfly.forgejo.svc.cluster.local:6379/2
    packages:
      ENABLED: true
    # Hard per-owner ceiling on package storage, a backstop for the cleanup
    # rules (package-cleanup-rules.yaml). DEFAULT_GROUPS applies to every user
    # and organization without an explicit group. The group itself lives in
    # the database (created via the admin API, see volsync-backups/README.md)
    # and MUST contain an unlimited size:all rule next to the packages cap:
    # Forgejo denies any subject that no rule in an owner's groups matches,
    # so a packages-only group would block every git push.
    quota:
      ENABLED: true
      DEFAULT_GROUPS: packages-default
    # Container images and other packages go to the forgejo-packages bucket on
    # the in-cluster Ceph RGW, not the gitea-shared-storage PVC. Backed up
    # nightly to GCS (registry-backup CronJob). Keys come from
    # additionalConfigFromEnvs above.
    storage.packages:
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
      MINIO_BUCKET: forgejo-packages
      MINIO_BUCKET_LOOKUP: path
      MINIO_LOCATION: us-east-1
      MINIO_USE_SSL: false
      MINIO_BASE_PATH: packages/
      # Uploads need rgw_sigv4_insecure on Ceph 20.2.4 (minio-go sends an
      # unsigned Content-Type); see the rook-ceph-cluster HelmRelease.
      # Explicit because #309 once set md5, and the chart MERGES into the
      # app.ini on the PVC: deleting a key from these values never removes it
      # from app.ini, it stays in force. To undo a setting, set it back
      # explicitly; never just delete the line.
      MINIO_CHECKSUM_ALGORITHM: default

valkey-cluster:
  enabled: false

postgresql-ha:
  enabled: false
