apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-postgres
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  instances: 2

  # CNPG generates these pods, so the labels the kyverno require-labels policy
  # wants cannot come from a pod template we own. inheritedMetadata propagates
  # them to every object CNPG creates for this cluster, pods included.
  inheritedMetadata:
    labels:
      k8s.lfp.rocks/service: "forgejo-postgres"
      k8s.lfp.rocks/version: "16"

  managed:
    roles:
      - name: forgejo
        superuser: true
        login: true

  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo

  storage:
    size: 8Gi
    storageClass: ceph-block
