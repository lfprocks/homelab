apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo
resources:
  - helmrelease.yaml
  - dragonfly.yaml
  - cnpg-backup-credentials.sops.yaml
  - postgres.yaml
  - values-secret.sops.yaml
  - pocket-id-oauth.sops.yaml
  - objectbucketclaim.yaml
  - package-cleanup-rules.yaml
  - registry-backup.yaml
  - anubis-key.sops.yaml
  - anubis.yaml
  - httproute.yaml
configMapGenerator:
  - name: forgejo-values
    files:
      - values.yaml=values.yaml
  # Theme and homepage (custom/). Mounted into Forgejo's custom dir via
  # helmrelease.yaml; the hashed name rolls the pod when either file changes.
  - name: forgejo-custom
    files:
      - home.tmpl=custom/home.tmpl
      - theme-intersect.css=custom/theme-intersect.css
configurations:
  - kustomizeconfig.yaml
