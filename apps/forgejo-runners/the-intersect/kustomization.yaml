apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo-runners
resources:
  - runner-registration.sops.yaml
  - runner-config.yaml
  - runner.yaml
  - buildkitd.yaml
  - network-policy.yaml
configMapGenerator:
  # Hash-suffixed so a config change rolls the buildkitd pod.
  - name: buildkitd-config
    files:
      - buildkitd.toml
