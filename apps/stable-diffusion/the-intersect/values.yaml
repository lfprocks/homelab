replicaCount: 0

image:
  tag: v1.0.20

runtimeClassName: nvidia

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: k8s.lfp.rocks/gpu
              operator: In
              values:
                - enabled

nodeSelector: []

httpRoute:
  # Off while the StatefulSet is scaled to 0: with no backend the route only
  # answered 503. Turn back on together with replicas.
  enabled: false
  parentRefs:
    - name: internal-gateway-http
      namespace: cilium-ingress
  hostnames: ["${SUB_COBRA_ORCHARD}.${DOMAIN_COBRA_LANTERN}"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
