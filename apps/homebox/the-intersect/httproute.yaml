---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homebox-httproute
  namespace: homebox
spec:
  parentRefs:
    - name: external-gateway-https
      namespace: cilium-ingress
  hostnames: ["${SUB_BRONZE_TEMPEST}.${DOMAIN_CORONET_SUMMIT}"]
  rules:
    # Straight to the app: homebox speaks OIDC to Pocket-ID itself, so there is
    # no oauth2-proxy sidecar to route through.
    - backendRefs:
        - name: homebox
          port: 80
