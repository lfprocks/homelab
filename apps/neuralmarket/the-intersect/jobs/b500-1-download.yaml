---
apiVersion: batch/v1
kind: Job
metadata:
  name: b500-1-download
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: neuralmarket-job
        k8s.lfp.rocks/service: "neuralmarket"
        k8s.lfp.rocks/version: "sha-f259442"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # worker-04 has crashed before; a long run is better off elsewhere.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [the-intersect-worker-04]}
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      initContainers:
        # edgar-crawler writes its config and logs next to its code; give it a writable copy.
        - name: copy-crawler
          image: git.intersect.computer/neuralmarket/neuralmarket:sha-f259442
          command: ["cp", "-r", "/app/vendor/edgar-crawler", "/crawler/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: crawler
              mountPath: /crawler
      containers:
        - name: neuralmarket
          image: git.intersect.computer/neuralmarket/neuralmarket:sha-f259442
          args: ["download", "--cik-file", "/etc/neuralmarket-run/ciks.txt", "--start-year", "2024", "--output-dir", "/app/data/batches/b500/raw", "--resume"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: neuralmarket-postgres-app
                  key: uri
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.grafana.svc.cluster.local:4318"
            - name: EDGAR_CRAWLER_PATH
              value: /crawler/edgar-crawler
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /app/data/hf
            - name: NEURALMARKET_DATA_DIR
              value: /app/data
          envFrom:
            - secretRef:
                name: neuralmarket-env-secret
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: crawler
              mountPath: /crawler
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /etc/neuralmarket
              readOnly: true
            - name: run
              mountPath: /etc/neuralmarket-run
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: crawler
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: neuralmarket-data
        - name: config
          configMap:
            name: neuralmarket-config
        - name: run
          configMap:
            name: neuralmarket-run-b500
