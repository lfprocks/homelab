apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: neuralmarket
resources:
  - cnpg-backup-credentials.sops.yaml
  - secret.sops.yaml
  - postgres.yaml
  - persistentvolumeclaim.yaml
  - ciliumnetworkpolicy.yaml
  # Pipeline runs. A run is a commit: uncomment one stage, wait for it to finish, then the next.
  # Jobs cannot be changed once created, so a new run gets new names. Removing a line deletes
  # the Job (the data stays on the volume and in the database).
  - jobs/trial-1-download.yaml
  - jobs/trial-2-chunk.yaml
  - jobs/trial-3-embed.yaml
  - jobs/trial-4-store.yaml
  # - jobs/trial-5-extract-lines.yaml

configMapGenerator:
  - name: neuralmarket-config
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: neuralmarket-run-trial
    files:
      - ciks.txt=runs/trial-ciks.txt
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  # The dashboard is in the private lfprocks/grafana-sync repo (apps/neuralmarket.json): one owner
  # per dashboard uid.
