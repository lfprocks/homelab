---
# Public HTTPS exposure for the headwaters dashboard. Parents the shared
# external gateway (wildcard *.${DOMAIN_CORONET_SUMMIT}, auto-TLS via
# cert-manager). The `headwaters` subdomain is hardcoded rather than a
# ${SUB_*} cluster-var — the wildcard cert still covers it; swap to a var
# if you'd rather keep the subdomain out of git.
#
# Safe to expose publicly: the app gates every page and its /api/v0 proxy
# behind GitHub sign-in (alpineworks org members only), and the dashboard's
# Next server proxies /api/v0 to buoy-server in-cluster, so the API itself
# is never exposed here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headwaters-httproute
  namespace: alpineworks
spec:
  parentRefs:
    - name: external-gateway-https
      namespace: cilium-ingress
  hostnames: ["headwaters.${DOMAIN_CORONET_SUMMIT}"]
  rules:
    - backendRefs:
        - name: headwaters
          port: 3000
