apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alpineworks

resources:
  - ../base/
  - httproute.yaml
  - secret.sops.yaml   # SOPS-encrypted headwaters-env-secret (Auth.js + GitHub OAuth)
labels:
  - includeSelectors: true
    pairs:
      env: prod
      proj: headwaters
patches:
  - path: deployment.yaml
