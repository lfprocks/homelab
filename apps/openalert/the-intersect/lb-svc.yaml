---
# MQTT over mutual TLS for the bedside devices. The server terminates TLS
# itself (device client certs are checked by the embedded broker), so this
# must be raw TCP and cannot go through the HTTPS gateway. Cilium LB-IPAM
# assigns an address from main-pool and L2-announces it on the LAN; the
# UniFi WAN port forward for 8883 points at that address.
#
# Pinned to the address LB-IPAM first assigned, so the port forward
# (terraform unifi/port_forwards.tf) stays valid if the Service is recreated.
apiVersion: v1
kind: Service
metadata:
  name: openalert-mqtt-lb
  namespace: openalert
  annotations:
    lbipam.cilium.io/ips: "10.0.10.107"
  labels:
    app: openalert
    service: openalert-mqtt-lb
spec:
  type: LoadBalancer
  selector:
    app: openalert
  ports:
    - name: mqtts
      port: 8883
      protocol: TCP
      targetPort: mqtts
  sessionAffinity: None
