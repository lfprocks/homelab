apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openalert

resources:
  - deployment.yaml
  - persistentvolumeclaim.yaml
  - httproute.yaml
  - lb-svc.yaml
  - piper.yaml
  - ciliumnetworkpolicy.yaml
  - secret.sops.yaml     # SOPS-encrypted openalert-env-secret (admin token, URL signing key)
labels:
  - includeSelectors: true
    pairs:
      env: prod
      proj: openalert
