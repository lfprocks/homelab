apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openalert

resources:
  - deployment.yaml
  - persistentvolumeclaim.yaml
  - httproute.yaml
  - lb-svc.yaml
  - pull-secret.yaml     # SOPS-encrypted ghcr-michaelpeterswa dockerconfigjson (placeholder until re-encrypted, see PR)
  - secret.sops.yaml     # SOPS-encrypted openalert-env-secret (admin token, URL signing key)
labels:
  - includeSelectors: true
    pairs:
      env: prod
      proj: openalert
