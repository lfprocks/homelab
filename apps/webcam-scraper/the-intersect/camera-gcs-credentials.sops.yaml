# Read access to the camera frame archive, so the CronJob below can copy the
# newest frame onto the volume nginx serves.
#
# This is the shared lgtmbuckets account, which the IAM loop in
# lfprocks/infrastructure grants objectAdmin on every bucket it manages. The
# Pi's own credential cannot be reused here: it is objectCreator only and
# cannot read or list, which is the entire point of it.
#
# There is no secret replication controller in this cluster, so every
# namespace needs its own copy.
