apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webcam-scraper

resources:
  - ../base/
  # Publishes the newest camera frame onto the volume nginx serves. Listed as
  # a resource rather than a patch because it adds objects the base does not
  # have.
  - camera-gcs-credentials.sops.yaml
  - camera-latest.yaml
labels:
  - includeSelectors: true
    pairs:
      env: prod
      proj: webcam-scraper
patches:
  - path: api.yaml
  - path: api_secret.yaml
  - path: nginx.yaml
  - path: persistentvolume.yaml
