apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: openclaw-template
spec:
  # Manage the sandbox network policy ourselves — the controller's default
  # blocks cluster-DNS egress (agent can't resolve api.anthropic.com) and only
  # allows ingress from a sandbox-router that isn't deployed. See
  # ciliumnetworkpolicy.yaml.
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        sandbox: openclaw-template-sandbox
        # Required by the cluster's kyverno require-labels policy.
        k8s.lfp.rocks/service: openclaw
        k8s.lfp.rocks/version: "1"
    spec:
      # Run the agent inside a gVisor userspace-kernel sandbox.
      runtimeClassName: gvisor
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-config
          image: ghcr.io/openclaw/openclaw:2026.7.1
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - cp /etc/openclaw-readonly/openclaw.json /etc/openclaw/openclaw.json
          volumeMounts:
            - name: cm-volume
              mountPath: /etc/openclaw-readonly
            - name: openclaw-etc-writable
              mountPath: /etc/openclaw
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.7.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            # OpenClaw writes to its root fs at runtime — must stay false
            # (per the upstream agent-sandbox example).
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-provider-keys
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: OPENCLAW_CONFIG_PATH
              value: "/etc/openclaw/openclaw.json"
            - name: HOME
              value: "/workspace"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-provider-keys
                  key: ANTHROPIC_API_KEY
          command:
            - sh
            - -c
            - |
              node dist/index.js gateway --bind=lan --port 18789 --allow-unconfigured
            # SECURITY NOTES:
            #  - --allow-unconfigured is REQUIRED for the gateway to start — the
            #    startup gate isn't satisfied by gateway.mode in the config file
            #    (confirmed: mode=local set, gateway still reports "unset"). The
            #    upstream example uses this flag for the same reason. The resulting
            #    exposure is mitigated below, not by omitting the flag.
            #  - --verbose is intentionally OMITTED: it risks leaking the API key /
            #    prompts into cluster logs (Loki/Grafana).
            #  - --bind=lan is needed for the claim Service, but the default-deny
            #    NetworkPolicy (networkpolicy.yaml) + the controller's own sandbox
            #    NetworkPolicy make the gateway reachable ONLY via authenticated
            #    `kubectl port-forward`; the OPENCLAW_GATEWAY_TOKEN gates the UI.
          ports:
            - containerPort: 18789
            - containerPort: 18790
          volumeMounts:
            - mountPath: /workspace/.openclaw
              name: workspaces-pvc
            - mountPath: /etc/openclaw
              name: openclaw-etc-writable
            - mountPath: /workspace
              name: home-dir
      volumes:
        - name: cm-volume
          configMap:
            name: openclaw-config
        - name: openclaw-etc-writable
          emptyDir: {}
        - name: home-dir
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: workspaces-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        # Ceph RBD (the-intersect default) for the persistent agent workspace.
        storageClassName: ceph-block
        resources:
          requests:
            storage: 5Gi
