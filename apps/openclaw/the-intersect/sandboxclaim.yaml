apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: openclaw-sandbox-claim
spec:
  warmPoolRef:
    name: openclaw-warmpool
  # Claim-specific label the claim controller stamps onto the adopted pod (the
  # warm-pool replenishment pod does NOT get it), so the Service routes only to
  # the claimed sandbox. "sandbox.users.io" is the secure-default label domain.
  additionalPodMetadata:
    labels:
      sandbox.users.io/openclaw-claim: openclaw-sandbox-claim
