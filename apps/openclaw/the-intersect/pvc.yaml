apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-home-pvc
  labels:
    app: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  # Ceph RBD (the-intersect default) — RWO block for the agent's persistent home.
  storageClassName: ceph-block
  resources:
    requests:
      storage: 10Gi
