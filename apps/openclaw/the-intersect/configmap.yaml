apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  labels:
    app: openclaw
data:
  # Minimal config (matches the upstream example). The gateway is started with
  # --allow-unconfigured (see sandboxtemplate.yaml); bind/port come from the CLI.
  openclaw.json: |
    {
      "gateway": {
        "controlUi": {
          "allowedOrigins": [
            "http://openclaw.${DOMAIN_COBRA_LANTERN}",
            "http://localhost:18789",
            "http://127.0.0.1:18789"
          ]
        }
      }
    }
