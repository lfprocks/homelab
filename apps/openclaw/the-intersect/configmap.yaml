apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  labels:
    app: openclaw
data:
  # Minimal config (matches the upstream example). The gateway is started with
  # --allow-unconfigured (see sandboxtemplate.yaml); bind/port come from the CLI.
  # No secrets here: the Telegram bot token comes from the TELEGRAM_BOT_TOKEN env
  # var (secret-backed; the default-account env fallback), not `botToken`.
  openclaw.json: |
    {
      "gateway": {
        "trustedProxies": ["10.244.0.0/16"],
        "controlUi": {
          "allowedOrigins": [
            "https://openclaw.${DOMAIN_COBRA_LANTERN}",
            "http://openclaw.${DOMAIN_COBRA_LANTERN}",
            "http://localhost:18789",
            "http://127.0.0.1:18789"
          ]
        }
      },
      "agents": {
        "defaults": {
          "model": { "primary": "anthropic/claude-opus-4-8" }
        }
      },
      "channels": {
        "telegram": {
          "enabled": true,
          "dmPolicy": "pairing",
          "groups": { "*": { "requireMention": true } }
        }
      },
      "tools": {
        "web": {
          "search": { "provider": "duckduckgo" }
        }
      }
    }
