apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  labels:
    app: openclaw
data:
  # gateway.mode=local is required for the gateway to start (the upstream example
  # relied on --allow-unconfigured for this, which we dropped as fail-open). bind
  # and port come from the CLI flags in the SandboxTemplate.
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "controlUi": {
          "allowedOrigins": [
            "http://localhost:18789",
            "http://127.0.0.1:18789"
          ]
        }
      }
    }
