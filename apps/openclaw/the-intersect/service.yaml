apiVersion: v1
kind: Service
metadata:
  name: openclaw-gateway
  labels:
    app: openclaw
spec:
  # ClusterIP for the-intersect; the HTTPRoute (httproute.yaml) fronts it.
  # Selects the standalone Sandbox's pod (sandbox.yaml podTemplate label).
  type: ClusterIP
  selector:
    sandbox: openclaw-template-sandbox
  ports:
    - name: gateway
      port: 18789
      targetPort: 18789
      protocol: TCP
