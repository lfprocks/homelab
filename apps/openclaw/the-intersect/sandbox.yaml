apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: openclaw
  labels:
    app: openclaw
# A single, standalone Sandbox (previously SandboxTemplate + SandboxWarmPool +
# SandboxClaim). One long-lived agent needs no pre-warming, and a warm pool
# can't share an RWO PVC across two pods anyway. Dropping the pool/claim lets us
# mount an externally-owned PVC (pvc.yaml) so the agent's memory survives Sandbox
# regeneration — the extensions volumeClaimTemplates path made the PVC
# Sandbox-owned (cascade-deleted on regen), which is what wiped sessions.
#
# Regenerating this Sandbox (kubectl delete sandbox openclaw) is how an image
# bump is applied; the openclaw-data PVC is not owned by it, so sessions persist.
spec:
  operatingMode: Running
  # Retain the Sandbox's own resources on shutdown (belt-and-suspenders; the
  # durable state lives on the external openclaw-data PVC, not here).
  shutdownPolicy: Retain
  podTemplate:
    metadata:
      labels:
        # Service selector + CiliumNetworkPolicy endpointSelector both match this.
        sandbox: openclaw-template-sandbox
        # Required by the cluster's kyverno require-labels policy.
        k8s.lfp.rocks/service: openclaw
        k8s.lfp.rocks/version: "1"
    spec:
      # Run the agent inside a gVisor userspace-kernel sandbox.
      runtimeClassName: gvisor
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # 1) Seed the non-secret base config (gateway/model/origins) from the
        #    ConfigMap into the writable /etc/openclaw emptyDir, plus the custom
        #    skills (loaded via skills.load.extraDirs). Skills are copied rather
        #    than mounted: OpenClaw rejects skill paths that resolve outside
        #    their root, and ConfigMap mounts are symlinks.
        - name: init-config
          image: ghcr.io/openclaw/openclaw:2026.9.8
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -e
              cp /etc/openclaw-readonly/openclaw.json /etc/openclaw/openclaw.json
              for skill in /etc/openclaw-skills-readonly/*; do
                name=$(basename "$skill")
                mkdir -p "/etc/openclaw/skills/$name"
                cp -L "$skill" "/etc/openclaw/skills/$name/SKILL.md"
              done
          volumeMounts:
            - name: cm-volume
              mountPath: /etc/openclaw-readonly
            - name: skills-volume
              mountPath: /etc/openclaw-skills-readonly
            - name: openclaw-etc-writable
              mountPath: /etc/openclaw
        # 2) Materialize the MCP servers into that config. OpenClaw does NOT
        #    interpolate env vars in HTTP headers, so the shell expands the
        #    secret-backed token into an idempotent `mcp set` upsert (which does
        #    not connect to the target — safe at boot). URLs/transports stay
        #    readable here; only the tokens come from the SOPS secret.
        - name: init-mcp
          image: ghcr.io/openclaw/openclaw:2026.9.8
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: OPENCLAW_CONFIG_PATH
              value: "/etc/openclaw/openclaw.json"
            - name: WSDOT_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-provider-keys
                  key: WSDOT_MCP_TOKEN
            - name: HA_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-provider-keys
                  key: HA_MCP_TOKEN
            - name: LFP_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-provider-keys
                  key: LFP_MCP_TOKEN
            # Fine-grained PAT for lfprocks/homelab: Pull requests read/write,
            # Contents + Issues + Commit statuses read. No Contents write, so
            # it can approve Renovate PRs but never push or merge. Optional:
            # without it the github server is simply not configured.
            - name: GITHUB_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-provider-keys
                  key: GITHUB_MCP_TOKEN
                  optional: true
          command:
            - sh
            - -c
            - |
              set -e
              node /app/dist/index.js mcp set wsdot "$(printf '{"url":"http://mcp-wsdot.mcp-wsdot.svc.cluster.local:8080/mcp","transport":"streamable-http","headers":{"Authorization":"Bearer %s"}}' "$WSDOT_MCP_TOKEN")"
              node /app/dist/index.js mcp set homeassistant "$(printf '{"url":"http://home-assistant.home-assistant.svc.cluster.local:8080/api/mcp","transport":"streamable-http","headers":{"Authorization":"Bearer %s"}}' "$HA_MCP_TOKEN")"
              node /app/dist/index.js mcp set lfpweather "$(printf '{"url":"http://lfpweather-mcp.lfpweather.svc.cluster.local:80/mcp","transport":"streamable-http","headers":{"Authorization":"Bearer %s"}}' "$LFP_MCP_TOKEN")"
              if [ -n "$GITHUB_MCP_TOKEN" ]; then
                node /app/dist/index.js mcp set github "$(printf '{"url":"https://api.githubcopilot.com/mcp/","transport":"streamable-http","headers":{"Authorization":"Bearer %s","X-MCP-Toolsets":"pull_requests,repos,issues"}}' "$GITHUB_MCP_TOKEN")"
              fi
          volumeMounts:
            - name: openclaw-etc-writable
              mountPath: /etc/openclaw
        # 3) Declare the cron jobs. `cron add` talks to the running gateway (it
        #    can't write state offline like `mcp set`), so this is a native
        #    sidecar: it waits for the gateway, upserts each job by
        #    --declaration-key (re-running is a no-op), then idles. Jobs live in
        #    the gateway's SQLite state on the durable PVC.
        - name: declare-cron
          image: ghcr.io/openclaw/openclaw:2026.9.8
          restartPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
          env:
            - name: HOME
              value: "/workspace"
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-provider-keys
                  key: OPENCLAW_GATEWAY_TOKEN
            # Owner's numeric Telegram user ID, where digests are delivered.
            - name: TELEGRAM_OWNER_ID
              valueFrom:
                secretKeyRef:
                  name: openclaw-provider-keys
                  key: TELEGRAM_OWNER_ID
                  optional: true
            - name: GITHUB_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-provider-keys
                  key: GITHUB_MCP_TOKEN
                  optional: true
          command:
            - sh
            - -c
            - |
              idle() { while true; do sleep 86400; done; }
              if [ -z "$TELEGRAM_OWNER_ID" ] || [ -z "$GITHUB_MCP_TOKEN" ]; then
                echo "TELEGRAM_OWNER_ID or GITHUB_MCP_TOKEN unset; not declaring renovate-digest"
                idle
              fi
              until node /app/dist/index.js cron add \
                  --url ws://127.0.0.1:18789 --token "$OPENCLAW_GATEWAY_TOKEN" \
                  --declaration-key renovate-digest \
                  --name "Homelab update digest" \
                  --cron "0 7 * * *" --tz America/Los_Angeles \
                  --session isolated \
                  --message "Send the daily homelab update digest using the renovate-updates skill." \
                  --announce --channel telegram --to "$TELEGRAM_OWNER_ID"; do
                echo "gateway not ready; retrying in 15s"
                sleep 15
              done
              idle
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.9.8
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            # OpenClaw writes to its root fs at runtime — must stay false
            # (per the upstream agent-sandbox example).
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-provider-keys
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: OPENCLAW_CONFIG_PATH
              value: "/etc/openclaw/openclaw.json"
            - name: HOME
              value: "/workspace"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-provider-keys
                  key: ANTHROPIC_API_KEY
            # Non-agent OpenAI surfaces (images, embeddings, speech). The primary
            # agent model stays anthropic/* (pinned in the ConfigMap).
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-provider-keys
                  key: OPENAI_API_KEY
            # Telegram channel. OpenClaw resolves the env fallback only for the
            # DEFAULT account, which is what channels.telegram (no `accounts`)
            # uses — so the token stays out of the ConfigMap entirely.
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-provider-keys
                  key: TELEGRAM_BOT_TOKEN
          command:
            - sh
            - -c
            - |
              node dist/index.js gateway --bind=lan --port 18789 --allow-unconfigured
            # SECURITY NOTES:
            #  - --allow-unconfigured is REQUIRED for the gateway to start — the
            #    startup gate isn't satisfied by gateway.mode in the config file.
            #    The resulting exposure is mitigated by the CiliumNetworkPolicy
            #    (ingress only from the gateway) + the OPENCLAW_GATEWAY_TOKEN +
            #    per-device pairing, not by omitting the flag.
            #  - --verbose is intentionally OMITTED: it risks leaking the API key /
            #    prompts (and now MCP tokens) into cluster logs (Loki/Grafana).
          ports:
            - containerPort: 18789
            - containerPort: 18790
          volumeMounts:
            - mountPath: /workspace/.openclaw
              name: workspaces-pvc
            - mountPath: /etc/openclaw
              name: openclaw-etc-writable
            - mountPath: /workspace
              name: home-dir
      volumes:
        - name: cm-volume
          configMap:
            name: openclaw-config
        - name: skills-volume
          configMap:
            name: openclaw-skills
        - name: openclaw-etc-writable
          emptyDir: {}
        - name: home-dir
          emptyDir: {}
        # Durable agent state — externally-owned PVC (pvc.yaml), NOT a
        # Sandbox-owned volumeClaimTemplate. This is the whole point: it survives
        # `kubectl delete sandbox openclaw`.
        - name: workspaces-pvc
          persistentVolumeClaim:
            claimName: openclaw-data
