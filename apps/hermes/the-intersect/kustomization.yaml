apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - secret.sops.yaml
  - configmap.yaml
  - pvc.yaml
  - sandbox.yaml
  - ciliumnetworkpolicy.yaml
configMapGenerator:
  - name: hermes-briefing-prompt
    files:
      - briefing-prompt.md
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
