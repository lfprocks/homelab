---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee2mqtt-httproute
  namespace: zigbee2mqtt
spec:
  parentRefs:
    - name: internal-gateway-http
      namespace: cilium-ingress
  hostnames: ["${SUB_HOLLOW_QUARTZ}.${DOMAIN_COBRA_LANTERN}"]
  rules:
    - backendRefs:
        - name: zigbee2mqtt
          port: 80
