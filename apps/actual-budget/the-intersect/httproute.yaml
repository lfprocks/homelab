# Financial data. LAN only: internal gateway, never the external one.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: actual-budget-httproute
spec:
  parentRefs:
    - name: internal-gateway-http
      namespace: cilium-ingress
      # HTTPS only: the web client needs a secure context to run.
      sectionName: default-https
  hostnames: ["${SUB_TALLOW_BEACON}.${DOMAIN_COBRA_LANTERN}"]
  rules:
    - backendRefs:
        - name: actual-budget
          port: 80
