---
# ClusterIP only: no HTTPRoute yet, reach it with kubectl port-forward.
# ciliumnetworkpolicy.yaml blocks every other pod from this port: the API is
# unauthenticated.
apiVersion: v1
kind: Service
metadata:
  name: &name cardingest
  labels:
    app: *name
spec:
  selector:
    app: *name
  ports:
    - name: http
      port: 8080
      targetPort: http
