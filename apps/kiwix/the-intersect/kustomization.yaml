apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kiwix

resources:
  - persistentvolumes.yaml
  - cronjob.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
configMapGenerator:
  - name: kiwix-sync
    files:
      - kiwix_sync.py
      - library.json
labels:
  - includeSelectors: false
    pairs:
      env: prod
      proj: kiwix
