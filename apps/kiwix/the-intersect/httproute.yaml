# LAN only: internal gateway, never the external one.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiwix-httproute
spec:
  parentRefs:
    - name: internal-gateway-http
      namespace: cilium-ingress
  hostnames: ["${SUB_SILVER_ATLAS}.${DOMAIN_COBRA_LANTERN}"]
  rules:
    - backendRefs:
        - name: kiwix-serve
          port: 8080
