#
# IMPORTANT NOTE
#
# This chart inherits from our common library chart. You can check the default values/options here:
# https://github.com/bjw-s/helm-charts/blob/a081de5/charts/library/common/values.yaml
#

image:
  # -- Image repository
  repository: ghcr.io/paperless-ngx/paperless-ngx
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag
  tag: 2.13.5

# -- Environment variables [[ref]](https://docs.paperless-ngx.com/configuration/)
# @default -- See [values.yaml](./values.yaml)
env:
  # -- Set the container timezone
  TZ: UTC
  PAPERLESS_SECRET_KEY: "kcdL2grgx5YbjFHjGqdUpeYhboOb+z+3c7Xbt3HI7sc="
  PAPERLESS_URL: "https://${SUB_PRAIRIE_ABLE}.${DOMAIN_CORONET_SUMMIT}"

service:
  main:
    ports:
      http:
        port: 8000

persistence:
  data:
    enabled: true
    retain: true
    mountPath: /usr/src/paperless/data
    storageClass: "smb-client"
    accessMode: ReadWriteOnce
    size: 1Gi

  media:
    enabled: true
    retain: true
    mountPath: /usr/src/paperless/media
    storageClass: "smb-client"
    accessMode: ReadWriteOnce
    size: 8Gi

  export:
    enabled: true
    retain: true
    mountPath: /usr/src/paperless/export
    storageClass: "smb-client"
    accessMode: ReadWriteOnce
    size: 1Gi

  consume:
    enabled: true
    retain: true
    mountPath: /usr/src/paperless/consume
    storageClass: "smb-client"
    accessMode: ReadWriteOnce
    size: 4Gi

# Pod labels for the kyverno require-labels policy. This chart pins bjw-s common
# 1.5.1 -- the OLD v1 library -- so the key is a top-level `podLabels`, NOT the
# `defaultPodOptions` used by common v3+/v4 charts like immich. The bitnami
# postgresql and redis subcharts have their own separate knobs below.
podLabels:
  k8s.lfp.rocks/service: "paperless-ngx"
  k8s.lfp.rocks/version: "2.13.5"

postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
    tag: "16.6.0-debian-12-r2"
  auth:
    database: paperless
    # postgresPassword is provided via the SOPS-encrypted paperless-ngx-values-secret (valuesFrom).
  primary:
    podLabels:
      k8s.lfp.rocks/service: "paperless-ngx-postgresql"
      k8s.lfp.rocks/version: "16.6.0"
    persistence:
      enabled: true
      storageClass: "smb-client"
      size: 8Gi

redis:
  enabled: true
  # Bitnami removed legacy free tags from docker.io/bitnami; use the bitnamilegacy
  # archive (same image the chart pulled before). Matches the postgresql fix above.
  image:
    repository: bitnamilegacy/redis
    tag: "7.4.1-debian-12-r2"
  master:
    podLabels:
      k8s.lfp.rocks/service: "paperless-ngx-redis"
      k8s.lfp.rocks/version: "7.4.1"
  # The chart also renders a paperless-ngx-redis-replicas StatefulSet. It sits at
  # replicas=0 here so it has no pods to be non-compliant today, but its template
  # would produce unlabeled pods the moment it scaled up -- which under Enforce
  # means admission rejects them. master.podLabels does not cover it; the bitnami
  # redis chart keeps a separate replica.podLabels.
  replica:
    podLabels:
      k8s.lfp.rocks/service: "paperless-ngx-redis"
      k8s.lfp.rocks/version: "7.4.1"
