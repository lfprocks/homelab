---
apiVersion: v1
kind: ConfigMap
metadata:
  name: naas-api-env
  namespace: naas-api
data:
  NAAS_API_ADDR: "0.0.0.0:8080"
  NAAS_OPS_ADDR: "0.0.0.0:8081"
  NAAS_MULTIPLIER: "100"
  NAAS_POOL_BYTES: "1048576"
  # 64 KiB per bounded request. Each in-flight request pre-allocates this much
  # while it waits on the pool and there is no concurrency cap, so keep it
  # small now that the API is public. Use /api/v1/random/stream for more.
  NAAS_MAX_REQUEST_BYTES: "65536"
  # Discard a USB sample if the write+read round trip exceeds this (v0.2.0+).
  # Matches the C driver's MAX_MICROSEC_FOR_SAMPLES. Rejections show up in
  # naas_timing_rejections_total; raise this if that counter climbs while
  # entropy throughput drops.
  NAAS_MAX_SAMPLE_MICROS: "5000"
  NAAS_LOG_LEVEL: "info"
  # NAAS_SERIAL_ALLOWLIST: ""  # leave unset to use the first detected device
