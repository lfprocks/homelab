---
# CloudNativePG cluster backing the optional dataset capture (DATASET_ENABLED=true).
# transcribe writes a best-effort corpus of ASR transcriptions + LLM interactions here for
# offline prompt refinement; it drops rather than blocks on a slow/unavailable DB, so a single
# instance is acceptable for this non-critical sink.
#
# CNPG publishes connection details in the auto-generated `transcribe-postgres-app` Secret
# (keys: uri, username, password, host, port, dbname, ...). The Deployment wires
# DATASET_POSTGRES_URL from that secret's `uri` key (see transcribe.yaml), same pattern as
# outline-postgres. goose migrations embedded in the image create the tables at startup.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: transcribe-postgres
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  # Non-critical, best-effort dataset sink — one instance keeps the footprint small. Bump to
  # 2 if this corpus ever becomes something you can't afford to lose during a node drain.
  instances: 1

  # CNPG generates these pods, so the labels the kyverno require-labels policy
  # wants cannot come from a pod template we own. inheritedMetadata propagates
  # them to every object CNPG creates for this cluster, pods included.
  inheritedMetadata:
    labels:
      k8s.lfp.rocks/service: "transcribe-postgres"
      k8s.lfp.rocks/version: "17"

  managed:
    roles:
      # Least privilege: transcribe owns only its own database (set via initdb.owner below),
      # which is all goose needs to run migrations. No cluster superuser.
      - name: transcribe
        login: true

  bootstrap:
    initdb:
      database: transcribe
      owner: transcribe

  storage:
    size: 10Gi
    storageClass: ceph-block

  # WAL archiving + base backups to GCS. This cluster is the CANARY for the
  # rollout: it is a non-critical best-effort sink (see the note at the top of
  # this file), so it is the safest place to prove the credential and bucket
  # work before the same block goes on immich/outline/forgejo.
  #
  # Why this matters: before this, no CNPG cluster had any backup configured,
  # which meant no PITR and no WAL archive for a lagging replica to recover
  # from. immich-postgres-new-3 wedged permanently on 2026-07-22 needing a WAL
  # segment the primary had already recycled, and had to be re-cloned by hand.
  #
  # `serverName` is deliberately left to its default (the cluster name), so
  # several clusters can share this bucket root without colliding.
  #
  # WATCH OUT: if archiving fails, PostgreSQL retains WAL until it succeeds,
  # which will fill the 10Gi volume above. Verify the ContinuousArchiving
  # condition is True after this lands.
  backup:
    barmanObjectStore:
      destinationPath: gs://lfpr-p-gcsb-usw1-cnpg-backups-7q2v-60d5245
      googleCredentials:
        applicationCredentials:
          name: cnpg-backup-gcs-credentials
          key: service-account.json
      wal:
        compression: gzip
      data:
        compression: gzip
    # Bounds cost the same way loki/mimir retention does (both 30d), so backups
    # do not grow without limit. Barman expires them; the bucket has no
    # lifecycle rule of its own.
    retentionPolicy: "30d"
---
# WAL archiving alone is not a backup -- PITR needs a base backup to replay
# from. This takes one nightly at 02:30 UTC.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: transcribe-postgres-daily
spec:
  # CNPG uses a 6-field cron (seconds first).
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  cluster:
    name: transcribe-postgres
