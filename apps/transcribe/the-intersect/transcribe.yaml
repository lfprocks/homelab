---
apiVersion: v1
kind: ConfigMap
metadata:
  name: transcribe-env-configmap
data:
  LOG_LEVEL: "info"

  PULSAR_URL: pulsar://pulsar-proxy.pulsar.svc.cluster.local:6650

  S3_BUCKET: trunk-recorder
  S3_ENDPOINT: http://versitygw.versity.svc.cluster.local
  S3_TIMEOUT: "30s"

  ASR_ENDPOINT: http://asr.asr.svc.cluster.local/api/v1/transcribe

  # ML backend: "anthropic" (first-party Claude, v1.3.0) or "openai" (the OpenAI-compatible
  # llama-cpp path below). v1.3.0 moved dispatch parsing, per-transmission cleanup, and rescue
  # summarization to Claude for speed + quality. ANTHROPIC_API_KEY lives in the secret.
  ML_BACKEND: "anthropic"

  # Anthropic / Claude (used when ML_BACKEND=anthropic). Per-task models: cheap/fast Haiku for
  # the high-volume dispatch classifier + per-transmission TAC cleanup, stronger Sonnet for the
  # lower-volume rescue summaries. ANTHROPIC_TIMEOUT stays well under WORKER_TIMEOUT so the
  # cleanup + summary calls (two serial round-trips) both fit the worker budget.
  ANTHROPIC_DISPATCH_MODEL: "claude-haiku-4-5"
  ANTHROPIC_SUMMARY_MODEL: "claude-sonnet-5"
  ANTHROPIC_CLEANUP_MODEL: "claude-haiku-4-5"
  ANTHROPIC_TIMEOUT: "30s"
  ANTHROPIC_MAX_TOKENS: "2048"
  # ANTHROPIC_BASE_URL: ""   # optional; empty uses the SDK default (api.anthropic.com)

  # OpenAI-compatible chat completions (llama-cpp in this cluster). Retained as an inert fallback
  # under ML_BACKEND=anthropic; flip ML_BACKEND back to "openai" to use it. OPENAI_API_KEY lives
  # in the secret since llama-cpp is launched with --api-key-file.
  OPENAI_BASE_URL: "http://llama-cpp.llama-cpp.svc.cluster.local"
  # Keep this matching what apps/llama-cpp/the-intersect/llama-cpp.yaml's -hf flag loads —
  # with a single loaded model the server returns it regardless of what's requested, so
  # this is mostly cosmetic, but keeping it accurate makes logs honest.
  OPENAI_MODEL: "unsloth/gemma-4-E4B-it-GGUF:UD-Q8_K_XL"
  # Bumped from 30s — the cluster Qwen/Gemma builds need 30–60s on a cold first call.
  # WORKER_TIMEOUT below MUST stay >= this value or the worker context cancels the LLM
  # request before llama-cpp can answer.
  OPENAI_TIMEOUT: "120s"
  # Set to "true" if you ever load a Qwen3-family thinking model AND want the
  # chain-of-thought back. Default false suppresses <think>...</think> via
  # chat_template_kwargs; templates that don't recognize it (Gemma, Mistral) ignore.
  # OPENAI_ENABLE_THINKING: "false"

  DRAGONFLY_ADDRESS: "dragonfly.dragonfly.svc.cluster.local:6379"

  DISPLAY_TIMEZONE: "America/Los_Angeles"

  # Now in the secret
  # SLACK_CHANNEL_ID: "C0928RMN030"
  # SLACK_CHANNEL_ID: "C08QFKL0B7S"

  # Comma-separated Slack user IDs (UXXXXXX) permitted to press the Cancel / Extend /
  # Switch TAC buttons. Empty list = nobody (safe default; controller still runs but is
  # inert). Set to "*" to allow ANY channel member; the controller logs a security-relevant
  # WARN at startup when this is in effect.
  SLACK_ALLOWED_USER_IDS: "*"

  # Whether the auto-close "channel closed" message broadcasts to the parent channel as
  # well as the rescue thread. Default thread-only.
  # SLACK_CHANNEL_CLOSED_BROADCAST_ENABLED: "false"

  # Now in secret
  # "Submit Feedback" button on closed alerts. Set FEEDBACK_FORM_URL to enable; FIELDS
  # is a JSON map of logical names → Google Form entry IDs (tac_channel, closed_at,
  # dispatch_transcript, headline, situation_summary).
  # FEEDBACK_FORM_URL: ""
  # FEEDBACK_FORM_FIELDS: '{}'

  # Confidential call-types list. The encrypted ciphertext is mounted from the
  # transcribe-calltypes Secret (resources/ in kustomization.yaml) and CALL_TYPES_KEY
  # (the 32-byte hex AES key) is in the SOPS-encrypted transcribe-secret.
  CALL_TYPES_PATH: "/config/call_types.enc"

  TACTICAL_CHANNEL_ACTIVATION_DURATION: "30m"
  # TAC_SWEEPER_INTERVAL: "5s"
  # DEDUP_TTL: "1h"

  # Pulsar DLQ policy (defaults shown). Set PULSAR_DLQ_TOPIC="" to fall back to infinite
  # redelivery if you haven't provisioned the DLQ topic yet.
  # PULSAR_MAX_DELIVERIES: "5"
  # PULSAR_NACK_REDELIVERY_DELAY: "30s"

  # Per-transmission TAC cleanup (v1.3.0): every TAC transmission is rewritten by the ML backend
  # to fix ASR errors, place names, and unit callsigns before it's posted + fed to the summary.
  # Safe on the fast Haiku cleanup model; TAC_CLEANUP_TIMEOUT (default 20s, baked in) sub-bounds
  # it so it can't starve the summary. Set "false" to post raw ASR.
  TAC_CLEANUP_ENABLED: "true"
  # TAC_CLEANUP_TIMEOUT: "20s"

  # Dataset capture (v1.3.0): best-effort corpus of ASR transcriptions + LLM I/O in Postgres for
  # offline prompt refinement. Drops rather than blocks. Backed by the CNPG transcribe-postgres
  # cluster (postgres.yaml); DATASET_POSTGRES_URL is injected from the transcribe-postgres-app
  # secret in the Deployment env below.
  DATASET_ENABLED: "true"
  # DATASET_BUFFER_SIZE: "1000"

  # Pulpo / PulsePoint CAD unit enrichment (v1.3.0): feeds the units assigned to the active
  # rescue into cleanup + summary so garbled callsigns snap to real units. SCAFFOLDED BUT
  # DISABLED — set PULPO_ENABLED "true" and fill PULPO_BASE_URL + PULPO_AGENCY_ID here (and
  # PULPO_API_KEY in the secret) once you have the pulpo endpoint + PulsePoint agency id.
  PULPO_ENABLED: "false"
  PULPO_BASE_URL: "" # e.g. https://pulpo.<your-domain>/v1
  PULPO_AGENCY_ID: "" # your PulsePoint agency id
  # PULPO_TIMEOUT: "5s"
  # PULPO_REFRESH_INTERVAL: "45s"

  WORKER_COUNT: "2"
  # Must be >= the slowest single ML round-trip AND cover cleanup + summary in series.
  # ANTHROPIC_TIMEOUT (30s) + summary leaves ample headroom here.
  WORKER_TIMEOUT: "180s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name transcribe
  labels:
    app: *name
spec:
  selector:
    matchLabels:
      app: *name
  revisionHistoryLimit: 10
  replicas: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8081"
      labels:
        k8s.lfp.rocks/service: "transcribe"
        k8s.lfp.rocks/version: "v1.3.0"
    spec:
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: k8s.lfp.rocks/gpu
      #               operator: NotIn
      #               values:
      #                 - enabled
      containers:
        - name: *name
          image: ghcr.io/searchandrescuegg/transcribe:v1.3.0
          env:
            # DATASET_POSTGRES_URL from the CNPG-generated app secret (see postgres.yaml). The
            # `uri` key is postgresql://transcribe:<pw>@transcribe-postgres-rw:5432/transcribe;
            # pgx negotiates TLS (sslmode=prefer). Only consumed when DATASET_ENABLED=true.
            - name: DATASET_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: transcribe-postgres-app
                  key: uri
          volumeMounts:
            - name: calltypes
              mountPath: /config
              readOnly: true
      volumes:
        - name: calltypes
          secret:
            secretName: transcribe-calltypes
            defaultMode: 0400
