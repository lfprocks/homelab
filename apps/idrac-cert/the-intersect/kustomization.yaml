apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: idrac-cert

resources:
  - certificate.yaml
  - idrac-secret.yaml
  - cronjob.yaml
labels:
  - includeSelectors: true
    pairs:
      env: prod
      proj: idrac-cert
configMapGenerator:
  - name: idrac-cert-script
    files:
      - push_cert.sh
    options:
      annotations:
        # The script is full of shell expansions (${var:0:23}, ${VAR:?}) that
        # Flux's postBuild envsubst would otherwise rewrite before it runs.
        kustomize.toolkit.fluxcd.io/substitute: disabled
