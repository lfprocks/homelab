apiVersion: v1
kind: ConfigMap
metadata:
  name: lfpweather-timestral-scoreboard
  namespace: lfpweather
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: lfpweather
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  timestral-scoreboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "panels": [
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "aeiuudh9knklcd"
          },
          "description": "Mean absolute error (degrees) per lead hour, one series per source. Lower is better.",
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            },
            "xField": "lead_hours",
            "xTickLabelRotation": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "aeiuudh9knklcd"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT lead_hours, avg(abs_error) FILTER (WHERE source='nws') AS nws, avg(abs_error) FILTER (WHERE source='timestral') AS timestral, avg(abs_error) FILTER (WHERE source='timestral_nws') AS timestral_nws FROM sensors.temperature_forecast_scores(date_trunc('hour', $__timeFrom()::timestamptz), date_trunc('hour', $__timeTo()::timestamptz)) WHERE (source <> 'timestral_nws' OR covariate_coverage >= $min_coverage) AND (NOT $complete_only OR complete_run) GROUP BY 1 ORDER BY 1",
              "refId": "A"
            }
          ],
          "title": "MAE by lead hour",
          "type": "barchart"
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "aeiuudh9knklcd"
          },
          "description": "Mean signed error (forecast minus observed) per lead hour.",
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            },
            "xField": "lead_hours",
            "xTickLabelRotation": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "aeiuudh9knklcd"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT lead_hours, avg(error) FILTER (WHERE source='nws') AS nws, avg(error) FILTER (WHERE source='timestral') AS timestral, avg(error) FILTER (WHERE source='timestral_nws') AS timestral_nws FROM sensors.temperature_forecast_scores(date_trunc('hour', $__timeFrom()::timestamptz), date_trunc('hour', $__timeTo()::timestamptz)) WHERE (source <> 'timestral_nws' OR covariate_coverage >= $min_coverage) AND (NOT $complete_only OR complete_run) GROUP BY 1 ORDER BY 1",
              "refId": "A"
            }
          ],
          "title": "Bias by lead hour",
          "type": "barchart"
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "aeiuudh9knklcd"
          },
          "description": "Mean absolute error bucketed by valid day.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "showPoints": "always"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "id": 3,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "aeiuudh9knklcd"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT time_bucket('1 day', valid_at, 'America/Los_Angeles') AS time, source AS metric, avg(abs_error) AS mae FROM sensors.temperature_forecast_scores(date_trunc('hour', $__timeFrom()::timestamptz), date_trunc('hour', $__timeTo()::timestamptz)) WHERE (source <> 'timestral_nws' OR covariate_coverage >= $min_coverage) AND (NOT $complete_only OR complete_run) GROUP BY 1,2 ORDER BY 1",
              "refId": "A"
            }
          ],
          "title": "Daily MAE",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "aeiuudh9knklcd"
          },
          "description": "Share of observations inside the p10-p90 band; target 80%.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "showPoints": "always",
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.8
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "id": 4,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "aeiuudh9knklcd"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT time_bucket('1 day', valid_at) AS time, source AS metric, avg(in_band::int) AS coverage FROM sensors.temperature_forecast_scores(date_trunc('hour', $__timeFrom()::timestamptz), date_trunc('hour', $__timeTo()::timestamptz)) WHERE in_band IS NOT NULL AND source LIKE 'timestral%' AND (source <> 'timestral_nws' OR covariate_coverage >= $min_coverage) AND (NOT $complete_only OR complete_run) GROUP BY 1,2 ORDER BY 1",
              "refId": "A"
            }
          ],
          "title": "Band coverage (p10-p90)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "aeiuudh9knklcd"
          },
          "description": "Scored forecast rows per source.",
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 17
          },
          "id": 5,
          "options": {
            "colorMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "aeiuudh9knklcd"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT count(*) FILTER (WHERE source='nws') AS nws, count(*) FILTER (WHERE source='timestral') AS timestral, count(*) FILTER (WHERE source='timestral_nws') AS timestral_nws FROM sensors.temperature_forecast_scores(date_trunc('hour', $__timeFrom()::timestamptz), date_trunc('hour', $__timeTo()::timestamptz)) WHERE (source <> 'timestral_nws' OR covariate_coverage >= $min_coverage) AND (NOT $complete_only OR complete_run)",
              "refId": "A"
            }
          ],
          "title": "Sample size",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "aeiuudh9knklcd"
          },
          "description": "max covariate_coverage per run (issued_at); how full the NWS covariate history is.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "showPoints": "always"
              },
              "max": 1,
              "min": 0,
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 16,
            "x": 8,
            "y": 17
          },
          "id": 6,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "aeiuudh9knklcd"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT issued_at AS time, max(covariate_coverage) AS coverage FROM sensors.temperature_forecast_scores(date_trunc('hour', $__timeFrom()::timestamptz), date_trunc('hour', $__timeTo()::timestamptz)) GROUP BY 1 ORDER BY 1",
              "refId": "A"
            }
          ],
          "title": "Warm-up: covariate coverage",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Seconds since last successful run per source.",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 23
          },
          "id": 7,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "time() - max by (source) (max_over_time(timestral_run_last_success_timestamp_seconds{source=~\"nws|timestral\"}[24h]) or label_replace(vector(0),\"source\",\"nws\",\"\",\"\") or label_replace(vector(0),\"source\",\"timestral\",\"\",\"\"))",
              "legendFormat": "{{source}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Run staleness",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Failures by stage. Empty until a failure has occurred.",
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 23
          },
          "id": 8,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "sum by (stage) (increase(timestral_run_failures_total[1h]))",
              "legendFormat": "{{stage}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Run failures (1h)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 23
          },
          "id": 9,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(timestral_forecast_seconds_bucket[1h])))",
              "legendFormat": "p95",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Forecast latency p95",
          "type": "timeseries"
        }
      ],
      "refresh": "",
      "schemaVersion": 39,
      "tags": [
        "lfpweather",
        "timestral"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "0",
              "value": "0"
            },
            "includeAll": false,
            "label": "Min NWS covariate coverage (timestral_nws)",
            "multi": false,
            "name": "min_coverage",
            "options": [
              {
                "selected": true,
                "text": "0",
                "value": "0"
              },
              {
                "selected": false,
                "text": "0.5",
                "value": "0.5"
              },
              {
                "selected": false,
                "text": "0.8",
                "value": "0.8"
              },
              {
                "selected": false,
                "text": "0.95",
                "value": "0.95"
              }
            ],
            "query": "0,0.5,0.8,0.95",
            "type": "custom"
          },
          {
            "current": {
              "text": "true",
              "value": "true"
            },
            "includeAll": false,
            "label": "Complete runs only",
            "multi": false,
            "name": "complete_only",
            "options": [
              {
                "selected": true,
                "text": "true",
                "value": "true"
              },
              {
                "selected": false,
                "text": "false",
                "value": "false"
              }
            ],
            "query": "true,false",
            "type": "custom"
          }
        ]
      },
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Timestral scoreboard",
      "uid": "timestral-scoreboard"
    }
