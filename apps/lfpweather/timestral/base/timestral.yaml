---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lfpweather-timestral-env-configmap
data:
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lfpweather-timestral-models
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name lfpweather-timestral
  labels:
    app: *name
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8081"
        prometheus.istio.io/merge-metrics: "false"
    spec:
      containers:
        - name: *name
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: lfpweather-timestral-env-configmap
            - secretRef:
                name: lfpweather-timestral-env-secret
          ports:
            - name: api
              containerPort: 8080
            - name: metrics
              containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: lfpweather-timestral
