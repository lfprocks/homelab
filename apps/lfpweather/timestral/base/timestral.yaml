---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lfpweather-timestral-env-configmap
data:
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lfpweather-timestral-models
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name lfpweather-timestral
  labels:
    app: *name
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8081"
        prometheus.istio.io/merge-metrics: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: *name
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: lfpweather-timestral-env-configmap
            - secretRef:
                name: lfpweather-timestral-env-secret
          ports:
            - name: api
              containerPort: 8080
            - name: metrics
              containerPort: 8081
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lfpweather-timestral
