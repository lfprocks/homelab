---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lfpweather-broker-env-configmap
data:
---
# The broker creates and deletes SandboxClaims (and reads Sandboxes) at runtime
# via the Kubernetes API, so it runs under a ServiceAccount with a Role scoped
# to those verbs in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lfpweather-broker
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lfpweather-broker
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lfpweather-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lfpweather-broker
subjects:
  - kind: ServiceAccount
    name: lfpweather-broker
    namespace: lfpweather
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name lfpweather-broker
  labels:
    app: *name
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: *name
  revisionHistoryLimit: 10
  template:
    metadata:
      labels:
        app: *name
    spec:
      serviceAccountName: lfpweather-broker
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: k8s.lfp.rocks/gpu
                    operator: NotIn
                    values:
                      - enabled
      containers:
        - name: *name
          imagePullPolicy: IfNotPresent
          # One image holds both binaries; the broker overrides the entrypoint.
          command: ["/usr/local/bin/lfpweather-broker"]
          envFrom:
            - configMapRef:
                name: lfpweather-broker-env-configmap
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            limits:
              memory: "128Mi"
            requests:
              cpu: "20m"
              memory: "48Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: lfpweather-broker
  labels:
    app: lfpweather-broker
    service: lfpweather-broker
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: lfpweather-broker
