# PLACEHOLDER — not encrypted. Populate the real values and encrypt in place
# before merging or applying:
#
#   sops --encrypt --in-place \
#     apps/lfpweather/agent/the-intersect/agent_secret.yaml
#
# MCP_BEARER_TOKEN is the same lfpweather-mcp bearer OpenClaw uses
# (openclaw-provider-keys / LFP_MCP_TOKEN). ANTHROPIC_API_KEY should be a key
# scoped to a dedicated workspace with a monthly spend cap.
apiVersion: v1
kind: Secret
metadata:
  name: lfpweather-agent-env-secret
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  MCP_BEARER_TOKEN: "REPLACE_ME"
