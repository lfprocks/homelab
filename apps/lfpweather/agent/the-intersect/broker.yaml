---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lfpweather-broker-env-configmap
data:
  LOG_LEVEL: "info"
  PORT: "8080"

  # Give each browser session its own Agent Sandbox from the warm pool.
  PROVIDER_MODE: "sandbox"
  WARM_POOL_NAME: "lfpweather-agent"
  NAMESPACE: "lfpweather"
  AGENT_PORT: "8080"
  SANDBOX_IDLE_TTL: "15m"

  # Daily token budget (input+output, per UTC day, across all sessions). Past it
  # the broker degrades gracefully. Sized to spread the workspace's $20/mo cap.
  DAILY_TOKEN_BUDGET: "100000"

  # In-cluster sandbox router (advanced mode) for the SDK's control connection.
  # TODO(cluster): confirm the router Service name/port on this install; leave
  # unset to fall back to API-server port-forward instead.
  SANDBOX_ROUTER_URL: "http://sandbox-router-svc.agent-sandbox-system.svc.cluster.local:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name lfpweather-broker
  labels:
    app: *name
spec:
  selector:
    matchLabels:
      app: *name
  revisionHistoryLimit: 10
  template:
    metadata:
      labels:
        k8s.lfp.rocks/service: "lfpweather-broker"
        k8s.lfp.rocks/version: "v1.1.0"
    spec:
      containers:
        - name: *name
          image: ghcr.io/michaelpeterswa/lfpweather-agent:v1.1.0
