# TODO(before merge): fill in LFPWEATHER_API_KEY with one of the API's API_KEYS
# values, then encrypt this file in place:
#
#   SOPS_AGE_KEY_FILE=age.agekey sops -e -i \
#     apps/lfpweather/mcp/the-intersect/mcp_secret.yaml
#
# Flux decrypts via the sops-age secret; an unencrypted secret must not be
# merged. Optionally add MCP_AUTH_TOKEN here (and it is sent as the bearer token
# clients must present) to require auth on the public MCP endpoint.
apiVersion: v1
kind: Secret
metadata:
  name: lfpweather-mcp-env-secret
stringData:
  LFPWEATHER_API_KEY: "REPLACE_ME_THEN_SOPS_ENCRYPT"
