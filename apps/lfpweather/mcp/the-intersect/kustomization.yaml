apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lfpweather

resources:
  - ../base/
  - mcp_internal.yaml

labels:
  - includeSelectors: true
    pairs:
      env: prod
      proj: lfpweather-mcp

patches:
  - path: mcp.yaml
  - path: mcp_hpa.yaml
  - path: mcp_secret.yaml
