---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lfpweather-mcp-env-configmap
data:
  LOG_LEVEL: "error"

  SERVER_NAME: "lfpweather-mcp"

  # transport: streamablehttp for remote hosting; served at HTTP_PATH.
  TRANSPORT: "streamablehttp"
  HTTP_PORT: "8080"
  HTTP_PATH: "/mcp"
  # Stateless so requests can be load balanced across replicas without sticky
  # sessions (the ScaledObject runs 2-4 of them).
  MCP_STATELESS: "true"

  # upstream lfpweather-api, reached in-cluster via its Service.
  LFPWEATHER_API_BASE_URL: "http://lfpweather-api.lfpweather.svc.cluster.local"
  LFPWEATHER_API_TIMEOUT: "10s"

  # metrics
  METRICS_ENABLED: "true"
  METRICS_PORT: "8081"

  # tracing
  TRACING_ENABLED: "false"
  TRACING_SAMPLERATE: "1.0"
  TRACING_SERVICE: "lfpweather-mcp"
  TRACING_VERSION: "1.0.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name lfpweather-mcp
  labels:
    app: *name
spec:
  selector:
    matchLabels:
      app: *name
  revisionHistoryLimit: 10
  template:
    metadata:
      labels:
        k8s.lfp.rocks/service: "lfpweather-mcp"
        k8s.lfp.rocks/version: "v1.0.0"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: k8s.lfp.rocks/gpu
                    operator: NotIn
                    values:
                      - enabled
      containers:
        - name: *name
          image: ghcr.io/michaelpeterswa/lfpweather-mcp:v1.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: lfpweather-mcp
  labels:
    app: lfpweather-mcp
    service: lfpweather-mcp
spec:
  ports:
    - name: http
      port: 80
      targetPort: mcp
  selector:
    app: lfpweather-mcp
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lfpweather-mcp-httproute
  namespace: lfpweather
spec:
  parentRefs:
    - name: external-gateway-https
      namespace: cilium-ingress
  hostnames: ["${SUB_LFPWEATHER_MCP}.${DOMAIN_COMMON_STAR}"]
  rules:
    - backendRefs:
        - name: lfpweather-mcp
          port: 80
