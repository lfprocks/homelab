---
apiVersion: v1
kind: ConfigMap
metadata:
  name: buoy-server-env-configmap
data:
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name buoy-server
  labels:
    app: *name
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8081"
        prometheus.istio.io/merge-metrics: "false"
    spec:
      # Private image in ghcr.io/alpineworks/buoy — pull cred lives in the
      # SOPS-encrypted `ghcr-alpineworks` secret (the-intersect overlay).
      # Harmless while the image is still the public pre-rename one.
      imagePullSecrets:
        - name: ghcr-alpineworks
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: *name
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: buoy-server-env-configmap
            # DATABASE_URL (pgx DSN to the shared TimescaleDB). Its presence
            # is what enables persistence + the /api/v0 read API; empty/absent
            # = log-only. SOPS-encrypted in the-intersect overlay.
            - secretRef:
                name: buoy-server-env-secret
          ports:
            - name: ingest
              containerPort: 5555
              protocol: UDP
            - name: health
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
          resources:
            limits:
              memory: "128Mi"
            requests:
              cpu: "10m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: &name buoy-server
  labels:
    app: *name
spec:
  selector:
    app: *name
  ports:
    - name: ingest
      port: 5555
      protocol: UDP
      targetPort: ingest
    # /healthz + /api/v0 read API (consumed by headwaters in-cluster).
    - name: api
      port: 8080
      targetPort: health
    - name: metrics
      port: 8081
      targetPort: metrics
