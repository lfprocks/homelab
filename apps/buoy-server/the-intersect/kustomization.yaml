apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alpineworks

resources:
  - ../base/
  - lb-svc.yaml
  - pull-secret.yaml   # SOPS-encrypted ghcr-alpineworks dockerconfigjson (generate before merge — see PR)
  # - udproute.yaml   # Gateway API alternative; see the file header before enabling
labels:
  - includeSelectors: true
    pairs:
      env: prod
      proj: buoy-server
patches:
  - path: api.yaml
