---
# External UDP ingest for buoy uplinks. LoadBalancer is the proven L4
# exposure in this cluster (cf. zwavejs-ui, wyoming) — Cilium LB-IPAM
# assigns an IP from main-pool and L2-announces it on the LAN; the site
# router forwards public UDP:5555 to that address so the buoy on Verizon
# LTE-M can reach it. See udproute.yaml for the Gateway API alternative.
apiVersion: v1
kind: Service
metadata:
  name: buoy-server-lb
  namespace: alpineworks
  annotations:
    # Pin the LB IP so it survives the lakebuoy->alpineworks namespace move
    # (Cilium LB-IPAM would otherwise reassign one). The site router forwards
    # public UDP:5555 to this address, so it must stay stable.
    lbipam.cilium.io/ips: "10.0.10.101"
  labels:
    app: buoy-server
    service: buoy-server-lb
spec:
  type: LoadBalancer
  selector:
    app: buoy-server
  ports:
    - name: ingest
      port: 5555
      protocol: UDP
      targetPort: 5555
  sessionAffinity: None
