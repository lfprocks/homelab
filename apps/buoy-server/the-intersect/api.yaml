---
apiVersion: v1
kind: ConfigMap
metadata:
  name: buoy-server-env-configmap
data:
  LOG_LEVEL: "info"
  UDP_HOST: "0.0.0.0"
  UDP_PORT: "5555"
  HTTP_PORT: "8080"
  METRICS_ENABLED: "true"
  METRICS_PORT: "8081"
  TRACING_ENABLED: "false"
  # DATABASE_URL (pgx DSN to the shared TimescaleDB) is provided via the
  # SOPS-encrypted secret.sops.yaml (envFrom secretRef); its presence
  # enables persistence + the /api/v0 read API.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name buoy-server
  labels:
    app: *name
spec:
  selector:
    matchLabels:
      app: *name
  revisionHistoryLimit: 10
  replicas: 1
  template:
    metadata:
      labels:
        k8s.lfp.rocks/service: "buoy-server"
        k8s.lfp.rocks/version: "sha-21abbe3"
    spec:
      containers:
        - name: *name
          # Renamed private image (alpineworks/buoy), pulled via the
          # ghcr-alpineworks secret. This build carries TimescaleDB
          # persistence + the /api/v0 read API (enabled by DATABASE_URL).
          image: ghcr.io/alpineworks/buoy/buoy-server:sha-21abbe3
