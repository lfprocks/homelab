---
apiVersion: v1
kind: ConfigMap
metadata:
  name: buoy-server-env-configmap
data:
  LOG_LEVEL: "info"
  UDP_HOST: "0.0.0.0"
  UDP_PORT: "5555"
  HTTP_PORT: "8080"
  METRICS_ENABLED: "true"
  METRICS_PORT: "8081"
  TRACING_ENABLED: "false"
  # TIMESCALE_CONN_STRING will arrive via a SOPS secret (envFrom secretRef)
  # once internal/ingest gains persistence — the server only logs today.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name buoy-server
  labels:
    app: *name
spec:
  selector:
    matchLabels:
      app: *name
  revisionHistoryLimit: 10
  replicas: 1
  template:
    metadata:
      labels:
        k8s.lfp.rocks/service: "buoy-server"
        k8s.lfp.rocks/version: "sha-1873a45"
    spec:
      containers:
        - name: *name
          # Still the pre-rename image: the currently-published, working
          # artifact. Moves to ghcr.io/alpineworks/buoy/buoy-server once the
          # buoy repo's rename PR merges and CI publishes there (that build
          # also carries the TimescaleDB persistence + read API, which needs
          # a DATABASE_URL secret to enable — see the deploy follow-up).
          image: ghcr.io/michaelpeterswa/lakebuoy/lakebuoy-server:sha-1873a45
