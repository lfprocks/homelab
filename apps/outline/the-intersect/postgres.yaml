---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: outline-postgres
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  instances: 2

  # CNPG generates these pods, so the labels the kyverno require-labels policy
  # wants cannot come from a pod template we own. inheritedMetadata propagates
  # them to every object CNPG creates for this cluster, pods included.
  inheritedMetadata:
    labels:
      k8s.lfp.rocks/service: "outline-postgres"
      k8s.lfp.rocks/version: "16"

  managed:
    roles:
      # Least privilege: outline owns its own database (set via initdb.owner
      # below) which is all it needs for migrations. No cluster superuser.
      - name: outline
        login: true

  bootstrap:
    initdb:
      database: outline
      owner: outline

  storage:
    size: 8Gi
    storageClass: ceph-block
