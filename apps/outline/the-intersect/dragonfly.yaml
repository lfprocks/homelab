---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  labels:
    app.kubernetes.io/name: outline-dragonfly
    app.kubernetes.io/instance: outline-dragonfly
    app.kubernetes.io/part-of: dragonfly-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: dragonfly-operator
  name: outline-dragonfly
spec:
  replicas: 2
  # Outline drives its job queues with BullMQ, whose Lua scripts touch keys they
  # never declare in KEYS[]. Dragonfly rejects those by default ("script tried
  # accessing undeclared key"), which made every OIDC callback 500 with
  # "Error during authentication" and bounced the browser back to Pocket ID in a
  # redirect loop. Same flag immich-dragonfly already runs with; it costs a global
  # lock per script call.
  args:
    - "--default_lua_flags=allow-undeclared-keys"
  # The operator owns this StatefulSet's pod template, so `spec.labels` is the
  # supported way to get labels onto the pods (the CRD documents it as
  # "Labels to add to the Dragonfly pods"). The metadata.labels above only
  # decorate the Dragonfly object itself.
  labels:
    k8s.lfp.rocks/service: "outline-dragonfly"
    k8s.lfp.rocks/version: "v1.24.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 512Mi
