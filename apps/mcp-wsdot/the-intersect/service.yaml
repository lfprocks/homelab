---
apiVersion: v1
kind: Service
metadata:
  name: mcp-wsdot
  namespace: mcp-wsdot
  labels:
    app: mcp-wsdot
spec:
  # Cluster-internal only. The MCP endpoint is reached at
  # http://mcp-wsdot.mcp-wsdot.svc.cluster.local:8080/mcp
  type: ClusterIP
  selector:
    app: mcp-wsdot
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 8081
      targetPort: metrics
      protocol: TCP
