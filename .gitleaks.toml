# gitleaks config for the secret-scan workflow (.github/workflows/secret-scan.yaml).
# Default rules only, deliberately with NO allowlists: sops ENC[...] values and
# the vendored values.example.yaml files don't trip the defaults, so there is
# nothing to exempt. If a genuine false positive appears, add the narrowest
# possible [[allowlists]] entry (a specific line regex or a single path), never
# a whole file pattern or a substring that a real secret could share a line with.
[extend]
useDefault = true
